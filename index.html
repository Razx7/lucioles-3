function drawArenaEdgeGradient(){
  if(!ARENA.w||!ARENA.h)return;
  /* IMPORTANT : cam.apply() ne scale pas le canvas avec zoom ; il déplace
     seulement la caméra. Les bords doivent donc utiliser les mêmes coordonnées
     écran que le terrain, sans multiplier par cam.zoom. */
  const L=-Math.round(cam.x)+cam.shakeX,T=-Math.round(cam.y)+cam.shakeY;
  const R=L+ARENA.w,B=T+ARENA.h,d=Math.max(18,40*cam.zoom);
  ctx.save();
  if(L>=0&&L<W){const dd=Math.min(d,W-L),g=ctx.createLinearGradient(L,0,L+dd,0);g.addColorStop(0,'rgba(0,0,0,.72)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(L,0,dd,H)}
  if(R<=W&&R>0){const dd=Math.min(d,R),g=ctx.createLinearGradient(R,0,R-dd,0);g.addColorStop(0,'rgba(0,0,0,.72)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(R-dd,0,dd,H)}
  if(T>=0&&T<H){const dd=Math.min(d,H-T),g=ctx.createLinearGradient(0,T,0,T+dd);g.addColorStop(0,'rgba(0,0,0,.72)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,T,W,dd)}
  if(B<=H&&B>0){const dd=Math.min(d,B),g=ctx.createLinearGradient(0,B,0,B-dd);g.addColorStop(0,'rgba(0,0,0,.72)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,B-dd,W,dd)}
  ctx.restore();
}

function missionTick(dt){
  const o=ARENA.objective;if(!o||!node)return;
  if(node.kind==='escort'){
    const near=dist(P.x,P.y,o.x,o.y)<220*S;
    for(const f of ARENA.flies||[])if(f.escort){
      const a=angTo(f.x,f.y,o.x,o.y),d=dist(f.x,f.y,o.x,o.y);
      f.x+=Math.cos(a)*(d>70*S?52:20)*dt;f.y+=Math.sin(a)*(d>70*S?52:20)*dt;
      if(d<80*S)f.reached=true;
    }
    const got=(ARENA.flies||[]).filter(f=>f.escort&&f.reached).length;
    o.progress=got/Math.max(1,(ARENA.flies||[]).filter(f=>f.escort).length);
    if(o.progress>=1)completeNode();
    if(near)for(const f of ARENA.flies||[])if(f.escort&&!f.reached){f.x=damp(f.x,P.x+rnd(-25,25),3,dt);f.y=damp(f.y,P.y+rnd(-25,25),3,dt)}
  }else if(node.kind==='defend'){
    for(const e of enemies){if(dist(e.x,o.x,e.y,o.y)<150*S)o.hp-=dt*(e.elite?8:3)}
    o.hp=clamp(o.hp,0,o.maxHp);missionTime>node.goal?completeNode():void 0;
    if(o.hp<=0){notify('L’arbre-lanterne est tombé…','🌑');missionFailed=true;missionFailT=1.2}
  }else if(node.kind==='race'){
    const d=dist(P.x,P.y,o.x,o.y);o.progress=1-clamp(d/(ARENA.w*.8),0,1);
    if(d<80*S&&missionTime<=node.goal)completeNode();
    else if(missionTime>node.goal){notify('La course est perdue…','⏱');missionFailed=true;missionFailT=1}
  }else if(node.kind==='puzzle'){
    const q=o.seq[o.next];
    if(q&&dist(P.x,P.y,q.x,q.y)<55*S){q.on=true;o.next++;AU.play('pickup');FX.ring(q.x,q.y,'180,240,255',6*S,55*S,.35);if(o.next>=o.seq.length)completeNode()}
  }else if(node.kind==='noDamage'){
    o.progress=clamp(missionTime/node.goal,0,1);
    if(missionTime>=node.goal)completeNode();
    if(lives<maxLives||P.hurtT>0){notify('Mission sans dégâts échouée — reprise…','❤');missionFailed=true;missionFailT=1.0}
  }
  if(missionFailed){missionFailT-=dt;if(missionFailT<=0){missionFailed=false;resetRun()}}
}

  if(o.kind==='escort'||o.kind==='race'||o.kind==='noDamage'){
    const col=o.kind==='race'?'255,210,120':'180,255,235';glow(o.x,o.y,34*S,col,.3);ctx.strokeStyle=css(col,.65);ctx.lineWidth=2*S;ctx.beginPath();ctx.arc(o.x,o.y,20*S+Math.sin(t*3)*4*S,0,TAU);ctx.stroke();txt(o.kind==='escort'?'✦':o.kind==='race'?'▶':'❤',o.x,o.y+6*S,16*S,'#fff','center',900);
  }else if(o.kind==='defend'){
    glow(o.x,o.y,65*S,'255,220,130',.28);ctx.strokeStyle='rgba(255,220,130,.7)';ctx.lineWidth=3*S;ctx.beginPath();ctx.arc(o.x,o.y,36*S,0,TAU);ctx.stroke();rr(o.x-50*S,o.y-60*S,100*S,6*S,3*S,'rgba(0,0,0,.5)');rr(o.x-50*S,o.y-60*S,100*S*(o.hp/o.maxHp),6*S,3*S,'#ffd479');txt('🌳',o.x,o.y+9*S,30*S,'#fff','center',900);

function loop(now){
  let dt=(now-last)/1000;last=now;
  if(!isFinite(dt)||dt<=0)dt=1/60;
  dt=Math.min(dt,.05);
  frame++;
  fpsAcc+=dt;fpsN++;
  if(fpsAcc>=.5){fps=fpsN/fpsAcc;fpsAcc=0;fpsN=0;autoQuality()}
  padPoll();
  if(state==='play')updatePlay(dt);
  else{t+=dt;updateAmbient(dt)}
  if(state==='play')updateAmbient(dt);
  transitionTick(dt);tickHover(dt);
  /* --- rendu --- */
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  switch(state){
    case 'menu':    drawMenu();break;
    case 'intro':   drawIntro();break;
    case 'map':     drawMap();break;
    case 'shop':    drawShop();break;
    case 'altar':   drawAltar();break;
    case 'options': drawOptions();break;
    case 'help':    drawHelp();break;
    case 'endlessUpgrade': drawEndlessUpgrade();break;
    case 'play':    renderWorld(false);drawHud();break;
    case 'pause':   renderWorld(false);drawHud();drawPause();break;
    case 'nodewin': renderWorld(false);drawHud();drawNodeWin();break;
    case 'over':    renderWorld(false);drawHud();drawOver();break;
    case 'victory': drawVictory();break;
    default:        drawMenu();
  }
  pwHud();
  drawNotifs();
  drawTouch();
  drawPerfHud();
  drawCursor();
  drawTransition();
  updateHint();
  AU.update();
  if(state==='nodewin'||state==='over')winTimer+=dt;
  scheduleNextFrame();
}
function scheduleNextFrame(){const cap=+opt.fpsCap||0;if(!cap){requestAnimationFrame(loop);return}const interval=1000/cap,now=performance.now();if(!nextFrameAt||nextFrameAt<now-interval*2)nextFrameAt=now+interval;const wait=Math.max(0,nextFrameAt-now);nextFrameAt+=interval;setTimeout(()=>requestAnimationFrame(loop),wait)}
function drawPerfHud(){const cap=+opt.fpsCap||0,label=cap?`FPS ${Math.round(fps)} / ${cap}`:`FPS ${Math.round(fps)} / ∞`;const w=118*S,h=25*S,x=W-w-12*S,y=12*S;rr(x,y,w,h,9*S,'rgba(4,7,16,.68)','rgba(255,255,255,.10)',S);txt(label,x+w/2,y+16*S,9.5*S,fps<40?'#ff9ca8':'#b8ffe6','center',800)}
function autoQuality(){
  if(!opt.auto)return;
  if(fps<42){slowFrames++;if(slowFrames>2){const i=QKEYS.indexOf(opt.quality);
    if(i>0){opt.quality=QKEYS[i-1];applyQuality();slowFrames=0;notify('Qualité réduite automatiquement ('+QLABEL[opt.quality]+')','⚙')}}}
  else slowFrames=Math.max(0,slowFrames-1);
}

/* ------------------------------- MANETTE -------------------------------- */
const PAD={on:false,prev:[],dx:0,dy:0};
function padPoll(){
  const list=navigator.getGamepads?navigator.getGamepads():[];let g=null;
  for(const q of list)if(q&&q.connected){g=q;break}
  if(!g){if(PAD.on){PAD.on=false;PAD.dx=PAD.dy=0;PAD.prev=[]}return}
  if(!PAD.on){PAD.on=true;notify('Manette détectée','🎮',2.5)}
  const B=i=>!!(g.buttons[i]&&g.buttons[i].pressed),ed=i=>B(i)&&!PAD.prev[i],rl=i=>!B(i)&&!!PAD.prev[i],C=CFG.pad;
  let ax=g.axes[0]||0,ay=g.axes[1]||0;
  if(B(14))ax=-1;else if(B(15))ax=1;if(B(12))ay=-1;else if(B(13))ay=1;
  const m=Math.hypot(ax,ay);PAD.dx=m>.22?ax:0;PAD.dy=m>.22?ay:0;
  if(state==='play'){
    if(ed(C.atk))playerAttack();
    if(ed(C.charge)){P.charging=true;P.charge=0}
    if(rl(C.charge)&&P.charging)playerCharged();
    if(ed(C.dash))doDash();if(ed(C.power))activatePower();if(ed(C.swarm))playerSwarm();
    if(ed(C.pause)){state='pause';AU.music(worldTrack('explore'))}
  }else if(state==='pause'){if(ed(C.pause)||ed(C.ok))state='play'}
  else if(ed(C.ok)&&(state==='menu'||state==='nodewin'||state==='over'||state==='intro'||state==='victory'))confirmState();
  PAD.prev=Array.from(g.buttons,b=>b.pressed);
}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(BLOCK.includes(k))e.preventDefault();
  AU.init();AU.resume();
  if(e.repeat)return;
  KEYS[k]=true;
  if(k==='m'){AU.setMute(!AU.muted);notify(AU.muted?'Son coupé':'Son rétabli',AU.muted?'🔇':'🔊',2);return}
  if(state==='intro'){endIntro();return}
  if(state==='play'){
    if(KM.pause.includes(k)){state='pause';AU.music('explore');return}
    if(KM.power.includes(k)){activatePower();return}
    if(KM.dash.includes(k)){doDash();return}
    if(KM.atk.includes(k)){primary();return}
    if(KM.charge.includes(k)){P.charging=true;P.charge=0;return}
    if(KM.swarm.includes(k)){playerSwarm();return}
    return;
  }
  if(state==='endlessUpgrade'){
    if(k==='1'||k==='2'||k==='3'){endlessChoose(+k-1);return}
    return;
  }
  if(state==='pause'){
    if(k==='p'||k==='escape'){state='play';return}
    if(k==='enter'||k===' ')confirmState();
    return;
  }
  if(state==='menu'){if(k==='enter'||k===' ')startGame();if(k==='o')optFrom='menu';return}
  if(state==='nodewin'||state==='over'){if(k==='enter'||k===' ')goMap();return}
  if(state==='map'){
    if(k==='escape'){goMenu();return}
    if(k==='b'){shopFromMap=true;setState('shop');return}
    if(k==='arrowleft'||k==='q'||k==='a'){if(mapWorld>0){mapWorld--;buildParallax(mapWorld)}return}
    if(k==='arrowright'||k==='d'){if(mapWorld<6&&isPlayable(mapWorld+1,0)){mapWorld++;buildParallax(mapWorld)}return}
    if(k==='arrowup'||k==='z'||k==='w'){nodeId=Math.max(0,nodeId-1);return}
    if(k==='arrowdown'||k==='s'){nodeId=Math.min(maps[mapWorld].length-1,nodeId+1);return}
    if(k==='enter'||k===' '){if(isPlayable(mapWorld,nodeId))startNode(mapWorld,nodeId);return}
    return;
  }
  if(state==='shop'||state==='altar'||state==='options'||state==='help'){
    if(k==='escape')backFrom();
    if(state==='shop'&&k>='1'&&k<='3')buy(+k-1);
    return;
  }
  if(state==='victory'&&(k==='enter'||k===' '))goMenu();
});

/* Certains navigateurs/trackpads peuvent perdre pointerdown sur un canvas.
   Ce gestionnaire DOM indépendant garantit qu'un clic/Entrée peut toujours
   lancer une partie, sans dépendre de 'regions'. */
let lastLaunchInput=0;
function directLaunchInput(){
  const now=performance.now();
  if(now-lastLaunchInput<180)return;
  lastLaunchInput=now;
  if(state==='menu'){
    startGame();
    return true;
  }
  if(state==='intro'){
    startNode(0,0);
    return true;
  }
  if(state==='map'){
    if(isPlayable(mapWorld,nodeId)){startNode(mapWorld,nodeId);return true}
    if(isPlayable(mapWorld,0)){nodeId=0;startNode(mapWorld,0);return true}
  }
  return false;
}
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key==='NumpadEnter')&&!e.ctrlKey&&!e.metaKey){
    if(state==='menu'||state==='intro'||state==='map'){
      e.preventDefault();e.stopPropagation();directLaunchInput();
    }
  }
},true);

  if(state==='menu'||state==='intro'||state==='map'){
    const p=pos(e),r=pickRegion(p.x,p.y);

       dernier a été perdu, relancer ici les actions de démarrage détectées. */

      if(state==='menu'&&r.id==='m_start'){startFresh(true);return}
      if(state==='menu'&&r.id==='m_cont'){startGame();return}
      if(state==='menu'&&r.id==='m_endless'){startEndless();return}
      if(state==='map'&&r.id&&r.id.startsWith('node')){const n=+r.id.slice(4);if(isPlayable(mapWorld,n))startNode(mapWorld,n);return}

    const dx=p.x-JOY.cx,dy=p.y-JOY.cy,d=Math.hypot(dx,dy)||1,m=Math.min(1,d/(46*S));

/* --------------------------- ACTIONS D'INTERFACE ------------------------ */
function handleUI(id){
  if(!id)return;
  if(id.startsWith('node')||id.startsWith('tab')){mapClick(id);return}
  if(id.startsWith('buy')){buy(+id.slice(3));return}
  if(id.startsWith('pk')){buyPerk(+id.slice(2));return}
  if(id.startsWith('sl_'))return;
  if(id.startsWith('tg_')){
    const row=OPTROWS.find(r=>'tg_'+r.id===id);
    if(row){opt[row.k]=!opt[row.k];saveOpts();AU.play('ui')}
    return}
  if(id.startsWith('cy_')){
    const row=OPTROWS.find(r=>'cy_'+r.id===id);
    if(row){row.next();saveOpts();AU.play('ui')}
    return}
  if(id.startsWith('ac_')){const row=OPTROWS.find(r=>'ac_'+r.id===id);if(row&&row.act)row.act();return}
  if(id.startsWith('eu_')){endlessChoose(+id.slice(3));return}
  switch(id){
    case 'm_start':startFresh();break;
    case 'm_cont':startGame();break;
    case 'm_opt':optFrom='menu';setState('options');break;
    case 'm_help':setState('help');break;
    case 'm_endless':startEndless();break;
    case 'm_night':if(SAVE.gameComplete)startNight();break;
    case 'm_bonus0':startBonus(0);break;
    case 'm_bonus1':startBonus(1);break;
    case 'mp_menu':goMenu();break;
    case 'mp_shop':shopFromMap=true;setState('shop');break;
    case 'mp_altar':setState('altar');break;
    case 'sh_back':setState('map');break;
    case 'al_back':setState('map');break;
    case 'op_back':backFrom();break;
    case 'hp_back':setState('menu');break;
    case 'pa_resume':state='play';break;
    case 'pa_opts':optFrom='pause';setState('options');break;
    case 'pa_map':goMap();break;
    case 'pa_menu':goMenu();break;
    case 'nw_ok':goMap();break;
    case 'nw_restart':restartCurrentNode();break;case 'nw_next':goNextNode();break;case 'nw_map':goMap();break;case 'nw_menu':goMenu();break;
    case 'ov_ok':goMap();break;case 'ov_restart':restartCurrentNode();break;case 'ov_map':goMap();break;case 'ov_menu':goMenu();break;
    case 'vi_ok':goMenu();break;
    default:break;
  }
  AU.play('ui');
}
