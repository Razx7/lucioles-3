const smooth=t=>t*t*(3-2*t);

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash2(x,y,s){let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(s|0,2246822519);h=(h^(h>>>13))>>>0;h=Math.imul(h,1274126177)>>>0;return((h^(h>>>16))>>>0)/4294967296}
/* couleurs : "r,g,b" ou "#rrggbb" -> [r,g,b] */
function col(c){
  if(Array.isArray(c))return c;
  if(c[0]==='#'){const n=parseInt(c.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]}
  const p=c.split(',');return[+p[0],+p[1],+p[2]];
}
const mix=(a,b,t)=>{const A=col(a),B=col(b);return[Math.round(lerp(A[0],B[0],t)),Math.round(lerp(A[1],B[1],t)),Math.round(lerp(A[2],B[2],t))]};
const NUMCOL=/^\s*\d+\s*,\s*\d+\s*,\s*\d+\s*$/;

  if(Array.isArray(c))return a===undefined?`rgb(${c[0]},${c[1]},${c[2]})`:`rgba(${c[0]},${c[1]},${c[2]},${a})`;

  return c;   // couleur CSS déjà prête (rgba(...), nom, etc.)
}

function sp(txt_,x,y,size,c,space,align='center',weight=700,font=SERIF,alpha=1){ // texte espacé (titre)

  ctx.textAlign='left';for(const ch of txt_){ctx.fillText(ch,px,y);px+=ctx.measureText(ch).width+space}
  ctx.globalAlpha=a;
}

  stepCount:0,lastStep:-1,

  init(){
    if(this.ready)return;this.ready=true;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      const ac=this.ac=new AC();
      const g=this.master=ac.createGain();g.gain.value=this.muted?0:.9;g.connect(ac.destination);
      this.musBus=ac.createGain();this.sfxBus=ac.createGain();this.ambBus=ac.createGain();
      this.musBus.connect(g);this.sfxBus.connect(g);this.ambBus.connect(g);
      /* Chaque famille possède sa propre chaîne d'écho : jamais de fuite vers un autre bus. */
      this.delay=ac.createDelay(1.2);this.delay.delayTime.value=.30;
      this.fb=ac.createGain();this.fb.gain.value=.34;
      this.dlyF=ac.createBiquadFilter();this.dlyF.type='lowpass';this.dlyF.frequency.value=2200;
      this.delay.connect(this.dlyF);this.dlyF.connect(this.fb);this.fb.connect(this.delay);this.delay.connect(this.musBus);
      this.sfxDelay=ac.createDelay(1.2);this.sfxDelay.delayTime.value=.23;
      this.sfxFb=ac.createGain();this.sfxFb.gain.value=.22;
      this.sfxDlyF=ac.createBiquadFilter();this.sfxDlyF.type='lowpass';this.sfxDlyF.frequency.value=2600;
      this.sfxDelay.connect(this.sfxDlyF);this.sfxDlyF.connect(this.sfxFb);this.sfxFb.connect(this.sfxDelay);this.sfxDelay.connect(this.sfxBus);
      /* bruit blanc réutilisable */
      const len=ac.sampleRate*3,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
      let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+w*.35)*.72;d[i]=last}
      this.noiseBuf=buf;
      /* --- lits d'ambiance : vent, pluie, forêt --- */
      const mk=(type,freq,q,vol)=>{
        const src=ac.createBufferSource();src.buffer=buf;src.loop=true;
        const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
        const gg=ac.createGain();gg.gain.value=vol;
        src.connect(f);f.connect(gg);gg.connect(this.ambBus);src.start();
        return{f,gg};
      };
      const w=mk('bandpass',420,.7,0.0001);this.windF=w.f;this.windG=w.gg;
      const r=mk('highpass',1400,.4,0.0001);this.rainF=r.f;this.rainG=r.gg;
      const b=mk('lowpass',180,.5,0);this.bedG=b.gg;
       const f2=mk('lowpass',250,.6,0.0001);this.forestG=f2.gg;
       const c=mk('bandpass',3200,.8,0.0001);this.cricketG=c.gg;
      this.ok=true;
      this.setVolumes();
      this.music('menu');
    }catch(e){this.ok=false}
  },
  resume(){try{if(this.ac&&this.ac.state==='suspended')this.ac.resume()}catch(e){}},
  setVolumes(){if(!this.ok)return;const m=this.muted?0:1;
    this.master.gain.value=clamp(opt.master==null?.9:opt.master,0,1)*m;
    this.musBus.gain.value=clamp(opt.music,0,1)*.5;
    this.sfxBus.gain.value=clamp(opt.sfx,0,1)*.9;
    this.ambBus.gain.value=clamp(opt.ambient,0,1)*.9;
    if(this.fb)this.fb.gain.value=.34;
    if(this.sfxFb)this.sfxFb.gain.value=.22;
  },
  setMute(v){this.muted=v;this.setVolumes()},
  testSlider(k){
    if(!this.ok||this.muted||this.testLock>0)return;
    this.testLock=.18;
    if(k==='music')this.tone({f:660,f2:880,d:.28,v:.13,type:'triangle',bus:this.musBus});
    else if(k==='ambient'){this.noise({filter:'bandpass',f:1500,f2:900,d:.16,v:.11,bus:this.ambBus});this.tone({f:980,f2:620,d:.22,v:.055,type:'sine',bus:this.ambBus});}
    else if(k==='sfx')this.noise({filter:'highpass',f:2100,f2:900,d:.12,v:.16,bus:this.sfxBus});
    else if(k==='master')this.tone({f:520,f2:760,d:.18,v:.09,type:'sine',bus:this.sfxBus});

  },
  get now(){return this.ac?this.ac.currentTime:0},

  /* ---------------------------- briques sonores --------------------------- */
  tone(o){
    if(!this.ok)return;const ac=this.ac,n=ac.currentTime+(o.at||0);
    const osc=ac.createOscillator(),g=ac.createGain();
    osc.type=o.type||'sine';osc.frequency.setValueAtTime(o.f,n);
    if(o.f2)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),n+(o.d||.2));
    const v=o.v==null?.2:o.v;g.gain.setValueAtTime(0,n);
    g.gain.linearRampToValueAtTime(v,n+(o.a==null?.008:o.a));
    g.gain.exponentialRampToValueAtTime(.0001,n+(o.d||.2));
    let node=g;
    if(o.filter){const f=ac.createBiquadFilter();f.type=o.filter;f.frequency.value=o.fc||900;f.Q.value=o.q||1;g.connect(f);node=f}
    osc.connect(g);node.connect(o.bus||this.sfxBus);
    if(o.echo){const s=ac.createGain();s.gain.value=o.echo;node.connect(s);
      const db=o.bus===this.musBus?this.delay:this.sfxDelay;s.connect(db)}
    osc.start(n);osc.stop(n+(o.d||.2)+.05);
  },
  noise(o){
    if(!this.ok)return;const ac=this.ac,n=ac.currentTime+(o.at||0);
    const src=ac.createBufferSource();src.buffer=this.noiseBuf;src.loop=true;
    src.playbackRate.value=o.rate||1;
    const f=ac.createBiquadFilter();f.type=o.filter||'bandpass';f.frequency.setValueAtTime(o.f||900,n);
    if(o.f2)f.frequency.exponentialRampToValueAtTime(Math.max(30,o.f2),n+(o.d||.2));
    f.Q.value=o.q||1;
    const g=ac.createGain();const v=o.v==null?.2:o.v;
    g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+(o.a||.005));
    g.gain.exponentialRampToValueAtTime(.0001,n+(o.d||.2));
    src.connect(f);f.connect(g);g.connect(o.bus||this.sfxBus);
    if(o.echo){const s=ac.createGain();s.gain.value=o.echo;g.connect(s);
      const db=o.bus===this.musBus?this.delay:this.sfxDelay;s.connect(db)}
    src.start(n);src.stop(n+(o.d||.2)+.05);
  },
  /* ------------------------------- SFX ---------------------------------- */
  play(name,o={}){
    if(!this.ok||this.muted)return;
    const R=rnd;
    switch(name){
      case 'step':      this.noise({filter:'bandpass',f:R(500,900),q:1.4,d:.09,v:.10,rate:R(.8,1.2)});break;

      case 'attack':    this.noise({filter:'bandpass',f:2600,f2:700,q:.9,d:.16,v:.16});this.tone({f:760,f2:1500,d:.13,v:.10,type:'triangle',echo:.18});break;

      case 'death':     [0,.14,.3].forEach((a,i)=>this.tone({f:[330,262,196][i],d:1.1,v:.12,type:'sawtooth',at:a,filter:'lowpass',fc:900}));break;

  thunder(i=1){
    if(!this.ok||this.muted)return;

    this.noise({filter:'lowpass',f:220*i,f2:60,d:d,v:.30,at:0});
    this.noise({filter:'lowpass',f:90,f2:40,d:d*1.4,v:.24,at:.12});

  /* --------------------------- ambiances météo --------------------------- */
  ambient(rain,windi,magic){
    if(!this.ok)return;const n=this.now;
    const rv=clamp(rain,0,1.4),wv=clamp(windi,0,1.4);
    this.rainG.gain.setTargetAtTime(rv*0.16,n,.6);
    this.rainF.frequency.setTargetAtTime(1200+rv*1800,n,.8);
    this.windG.gain.setTargetAtTime(wv*0.075,n,1.2);
    this.windF.frequency.setTargetAtTime(300+wv*700+Math.sin(t*.23)*120,n,1.4);
    this.bedG.gain.setTargetAtTime(0,n,.05);
    if(this.forestG)this.forestG.gain.setTargetAtTime(.022*(1-rv*.35),n,1.1);
    if(this.cricketG)this.cricketG.gain.setTargetAtTime(.014*(.35+Math.max(0,1-rv))* (magic?1.25:1),n,1.4);
  },
  /* ------------------------------ MUSIQUE -------------------------------- */
  /* Musique générative v2 : demi-tons MIDI -> Hz (justes), progressions d'accords,

      arpP:[0,2,1,3,0,2,1,3],bass:[0,null,0,null,0,null,12,null],kick:[0,4],snare:[],hat:1,drumV:.8},
    boss:{bpm:120,tonic:62,lead:'sawtooth',leadFc:2200,arp:'triangle',pad:'sawtooth',padFc:600,leadV:.15,arpV:.11,padV:.045,bassV:.46,bassW:'triangle',arpOdd:.7,
      prog:[[38,[0,3,7,12]],[34,[0,4,7,12]],[36,[0,4,7,12]],[45,[0,4,7,12]]],
      mel:[[7,7,null,10,null,7,5,null],[8,null,8,12,null,8,7,null],[10,null,10,14,null,10,8,null],[11,null,14,11,null,7,11,null]],
      arpP:[0,1,2,3,2,1,2,3],bass:[0,null,0,0,null,0,7,12],kick:[0,3,4],snare:[2,6],hat:2,drumV:1},
    final:{bpm:132,tonic:60,lead:'sawtooth',leadFc:2400,arp:'triangle',pad:'sawtooth',padFc:650,leadV:.15,arpV:.11,padV:.05,bassV:.48,bassW:'triangle',arpOdd:.8,

      arpP:[0,1,2,3,3,2,1,2],bass:[0,0,null,0,0,null,7,12],kick:[0,3,4,7],snare:[2,6],hat:2,drumV:1.1},
    victory:{bpm:96,tonic:60,lead:'triangle',arp:'triangle',pad:'triangle',padFc:1200,leadV:.30,arpV:.13,padV:.085,bassV:.36,bassW:'sine',arpOdd:.5,
      prog:[[48,[0,4,7,12]],[43,[0,4,7,12]],[45,[0,3,7,12]],[41,[0,4,7,12]]],

  music(name){
    if(!this.ok||this.track===name)return;
    this.track=name;const T=this.TRACKS[name]||this.TRACKS.explore;this.T=T;
    this.stepDur=60/T.bpm/2;this.time=this.now+.08;this.step=0;this.chord=0;
  },
  update(){
    if(!this.ok||!this.T||this.muted)return;
    const ac=this.ac,horizon=ac.currentTime+.35;
    if(this.time<ac.currentTime-.5)this.time=ac.currentTime+.05; /* rattrapage après onglet en veille */
    let guard=0;
    while(this.time<horizon&&guard++<16){
      const T=this.T,s=this.step,n=this.time,sd=this.stepDur;
      const pos=s%8,bar=Math.floor(s/8)%T.prog.length,root=T.prog[bar][0],ct=T.prog[bar][1];
      if(pos===0)ct.forEach((iv,k)=>this.pad(n,sd*8,root+12+iv,T.padV*(k===3?.6:1),T));
      const b=T.bass[pos];if(b!=null)this.bass(n,root+b,T.bassV,sd,T);
      if(pos%2===0||Math.random()<T.arpOdd)this.pluck(n,root+24+ct[T.arpP[pos]],T.arpV,T.arp);
      const m=T.mel[bar][pos];if(m!=null)this.lead(n,T.tonic+m,T.leadV,sd,T);
      this.drums(n,pos,T);
      this.step++;this.time+=sd;
    }
  },
  pad(at,dur,m,v,T){
    const ac=this.ac,g=ac.createGain(),f=ac.createBiquadFilter();
    f.type='lowpass';f.frequency.value=T.padFc;f.Q.value=.6;
    const a=Math.min(1.4,dur*.3);
    g.gain.setValueAtTime(.0001,at);g.gain.linearRampToValueAtTime(v,at+a);
    g.gain.setValueAtTime(v,at+dur*.75);g.gain.linearRampToValueAtTime(.0001,at+dur+.9);
    [-7,7].forEach(c=>{const o=ac.createOscillator();o.type=T.pad;o.frequency.value=this.mf(m);o.detune.value=c;o.connect(f);o.start(at);o.stop(at+dur+1)});
    f.connect(g);g.connect(this.musBus);
    const e=ac.createGain();e.gain.value=.3;g.connect(e);e.connect(this.delay);
  },
  bass(at,m,v,sd,T){
    const ac=this.ac,o=ac.createOscillator(),g=ac.createGain();
    o.type=T.bassW;o.frequency.value=this.mf(m);
    const d=sd*(T.kick.length?1.7:3.6);
    g.gain.setValueAtTime(.0001,at);g.gain.linearRampToValueAtTime(v,at+.02);g.gain.exponentialRampToValueAtTime(.0001,at+d);
    o.connect(g);g.connect(this.musBus);o.start(at);o.stop(at+d+.05);
  },
  pluck(at,m,v,type){
    const ac=this.ac,o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();
    o.type=type;o.frequency.value=this.mf(m);f.type='lowpass';f.frequency.value=2400;f.Q.value=.5;
    g.gain.setValueAtTime(.0001,at);g.gain.linearRampToValueAtTime(v,at+.01);g.gain.exponentialRampToValueAtTime(.0001,at+.7);
    o.connect(f);f.connect(g);g.connect(this.musBus);
    const e=ac.createGain();e.gain.value=.3;g.connect(e);e.connect(this.delay);
    o.start(at);o.stop(at+.75);
  },
  lead(at,m,v,sd,T){
    const ac=this.ac,g=ac.createGain(),f=ac.createBiquadFilter(),d=sd*2.8;
    f.type='lowpass';f.frequency.value=T.leadFc||3000;f.Q.value=.5;
    g.gain.setValueAtTime(.0001,at);g.gain.linearRampToValueAtTime(v,at+.03);g.gain.exponentialRampToValueAtTime(.0001,at+d);
    [-5,5].forEach(c=>{const o=ac.createOscillator();o.type=T.lead;o.frequency.value=this.mf(m);o.detune.value=c;o.connect(f);o.start(at);o.stop(at+d+.05)});
    f.connect(g);g.connect(this.musBus);
    const e=ac.createGain();e.gain.value=.4;g.connect(e);e.connect(this.delay);
  },
  hit(at,dur,type,fc,v){
    const ac=this.ac,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
    s.buffer=this.whiteBuf;f.type=type;f.frequency.value=fc;
    g.gain.setValueAtTime(v,at);g.gain.exponentialRampToValueAtTime(.0001,at+dur);
    s.connect(f);f.connect(g);g.connect(this.musBus);s.start(at,Math.random()*.5);s.stop(at+dur+.02);
  },
  drums(at,pos,T){
    if(!T.kick.length&&!T.hat)return;
    const ac=this.ac,dv=T.drumV||1;
    if(!this.whiteBuf){const len=ac.sampleRate,bf=ac.createBuffer(1,len,ac.sampleRate),d=bf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;this.whiteBuf=bf}
    if(T.kick.includes(pos)){
      const o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.setValueAtTime(130,at);o.frequency.exponentialRampToValueAtTime(45,at+.14);
      g.gain.setValueAtTime(.7*dv,at);g.gain.exponentialRampToValueAtTime(.0001,at+.24);
      o.connect(g);g.connect(this.musBus);o.start(at);o.stop(at+.28);
    }
    if(T.snare.includes(pos))this.hit(at,.14,'bandpass',1800,.35*dv);
    if(T.hat===2||(T.hat===1&&pos%2===1))this.hit(at,.045,'highpass',7000,.12*dv);
  }
};

/* ====================== P2a — PARTICULES / MÉTÉO / CIEL =================== */
/* --- moteur de particules (pool simple, plafond automatique) -------------- */
const FX={
  p:[],cap:600,
  add(type,x,y,o){
    if(this.p.length>=this.cap&&!o.crit)return null;
    const q={t:type,x,y,vx:o.vx||0,vy:o.vy||0,l:o.l||.6,ml:o.l||.6,r:o.r||3,c:o.c||[200,240,255],a:o.a==null?1:o.a,
      rot:o.rot||0,vr:o.vr||0,gr:o.gr==null?.02:o.gr,gl:o.gl||0,sc:o.sc||0,txt:o.txt||'',w:o.w||1};
    this.p.push(q);return q;
  },
  burst(x,y,c,n,spd,o={}){
    const cap=Math.min(n,Math.max(3,Math.round(n*opt.particles)));
    for(let i=0;i<cap;i++){const a=o.dir==null?rnd(0,TAU):o.dir+rnd(-(o.spread||.6),(o.spread||.6));
      const v=rnd(.35,1)*spd;
      this.add(o.type||'spark',x,y,{vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rnd(.3,.9)*(o.lm||1),r:rnd(1.2,3)*(o.rm||1),c,a:o.a==null?1:o.a,gl:o.gl||0,gr:o.gr});}
  },
  ring(x,y,c,r0,r1,l){this.add('ring',x,y,{r:r0,c,l,a:1,gl:0,sc:(r1-r0)/l,crit:true})},
  text(x,y,s,c,big){this.add('text',x,y,{txt:s,c,l:big?1.1:.8,gl:0,vy:-26,gr:.9,r:big?20:14})},
  update(dt){
    const p=this.p;
    for(let i=p.length-1;i>=0;i--){
      const q=p[i];q.l-=dt;
      if(q.l<=0){p[i]=p[p.length-1];p.pop();continue}
      q.x+=q.vx*dt;q.y+=q.vy*dt;
      if(q.gr<1){const d=Math.pow(q.gr,dt*60);q.vx*=d;q.vy*=d}
      if(q.t==='dust'){q.vx+=Math.sin(t*.7+q.y*.01)*6*dt;q.vy-=4*dt}
      if(q.t==='leaf'){q.vx+=Math.sin(t*1.6+q.rot*3)*26*dt+WX.windX*30*dt;q.vy+=18*dt;q.rot+=q.vr*dt}
      if(q.t==='smoke')q.r+=q.sc*dt;
      if(q.t==='ring')q.r+=q.sc*dt;
      if(q.t==='splash')q.vy+=520*dt;
      if(q.t==='spark'||q.t==='magic')q.vy+=18*dt;
    }
  },
  draw(gl){
    const p=this.p;
    for(let i=0;i<p.length;i++){
      const q=p[i];if(q.gl!==gl)continue;
      const f=clamp(q.l/q.ml,0,1),al=q.a*f;
      switch(q.t){
        case 'dust':  ctx.globalAlpha=al*.5;circle(q.x,q.y,q.r*(1+f*.4),css(q.c,.5));break;
        case 'spark': {ctx.globalAlpha=al;ctx.globalCompositeOperation='lighter';
          const L=Math.min(14,Math.hypot(q.vx,q.vy)*.05);
          if(L>1){line(q.x,q.y,q.x-Math.sign(q.vx||1)*L*.4,q.y-Math.sign(q.vy||1)*L*.4,css(q.c,al*.5),q.r*.9);}
          glow(q.x,q.y,q.r*4*f+2,q.c,al*.6);ctx.globalCompositeOperation='source-over';break}
        case 'magic': {ctx.globalCompositeOperation='lighter';ctx.globalAlpha=al;
          const r=q.r*(1+Math.sin(t*8+q.rot)*.2);const g2=ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,r*5);g2.addColorStop(0,css(q.c,.9));g2.addColorStop(1,css(q.c,0));
          ctx.fillStyle=g2;ctx.beginPath();ctx.arc(q.x,q.y,r*5,0,TAU);ctx.fill();
          ctx.strokeStyle=css(q.c,.5);ctx.lineWidth=1;ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.rot);
          for(let k=0;k<4;k++){ctx.rotate(Math.PI/2);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(r*2.6,0);ctx.stroke()}
          ctx.restore();ctx.globalCompositeOperation='source-over';break}
        case 'ring':  ctx.globalAlpha=al*.8;ctx.strokeStyle=css(q.c,al*.8);ctx.lineWidth=Math.max(1,2.2*f);ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,TAU);ctx.stroke();break;
        case 'smoke': ctx.globalAlpha=al*.22;circle(q.x,q.y,q.r,css(q.c,1));break;
        case 'splash':ctx.globalAlpha=al*.8;line(q.x,q.y,q.x-q.vx*.02,q.y-q.vy*.03,css(q.c,al),Math.max(1,q.r*.5));break;
        case 'leaf':  {ctx.globalAlpha=al;ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.rot);
          ctx.fillStyle=css(q.c,1);ctx.beginPath();ctx.ellipse(0,0,q.r*1.6,q.r*.7,0,0,TAU);ctx.fill();
          ctx.strokeStyle=css(shade(q.c,.6),1);ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(-q.r*1.6,0);ctx.lineTo(q.r*1.6,0);ctx.stroke();ctx.restore();break}
        case 'text':  txtShadow(q.txt,q.x,q.y,q.r,css(q.c,al),'center',900,FONT,al);break;
        case 'rain':  ctx.globalAlpha=al;line(q.x,q.y,q.x-q.vx*.03,q.y-q.vy*.03,css(q.c,al),q.w);break;
      }
      ctx.globalAlpha=1;
    }
  },
  clear(){this.p.length=0}
};

/* ------------------------------- MÉTÉO ----------------------------------- */
const WEATHERS={
  calm :{name:'Nuit calme',   icon:'☾', rain:0,   fog:.10,wind:.15,light:1.00,fly:1.0},
  wind :{name:'Vent fort',    icon:'💨',rain:.06, fog:.14,wind:1.00,light:.96, fly:.8},
  rain :{name:'Pluie',        icon:'🌧',rain:.70, fog:.28,wind:.45,light:.80, fly:.7},
  storm:{name:'Orage',        icon:'⛈',rain:1.15,fog:.34,wind:1.20,light:.62, fly:.45},
  fog  :{name:'Brouillard',   icon:'🌫',rain:0,   fog:1.00,wind:.12,light:.76, fly:.9},
  magic:{name:'Nuit magique', icon:'✨',rain:0,   fog:.18,wind:.25,light:1.05,fly:2.4}
};
const WX={
  cur:'calm',from:'calm',k:1,dur:9,timer:52,
  rain:0,fog:.10,wind:.15,light:1,fly:1,windX:0,windY:0,windT:0,
  flash:0,bolt:null,boltT:0,thunderIn:0,
  init(w){const list=worlds[w]?worlds[w].weather:['calm'];this.cur=pick(list);this.from=this.cur;this.k=1;this.apply(1);this.timer=rnd(35,70)},
  apply(k){
    const A=WEATHERS[this.from]||WEATHERS.calm,B=WEATHERS[this.cur]||WEATHERS.calm;
    this.rain=lerp(A.rain,B.rain,k);this.fog=lerp(A.fog,B.fog,k);
    this.wind=lerp(A.wind,B.wind,k);this.light=lerp(A.light,B.light,k);this.fly=lerp(A.fly,B.fly,k);
  },
  set(name){if(name===this.cur)return;this.from=this.cur;this.cur=name;this.k=0;this.dur=rnd(7,13);
    if(WEATHERS[name])notify((WEATHERS[name].icon||'')+' '+WEATHERS[name].name+'…','wx')},
  update(dt){
    if(this.k<1){this.k=Math.min(1,this.k+dt/this.dur);this.apply(smooth(this.k))}
    /* vent : direction qui dérive lentement */
    this.windT+=dt;
    const wa=Math.sin(this.windT*.07)*1.4+Math.sin(this.windT*.031+2)*.8;
    this.windX=Math.cos(wa)*this.wind;this.windY=Math.sin(wa)*this.wind*.4;
    if(state==='play'&&opt.weather){
      this.timer-=dt;
      if(this.timer<=0){
        this.timer=rnd(45,95);
        const list=(worlds[worldId]&&worlds[worldId].weather)||['calm'];
        let n=pick(list);if(n===this.cur)n=pick(list);this.set(n);
      }
    }
    /* orage : éclairs */
    if(this.cur==='storm'||this.cur==='rain'){
      this.flash=Math.max(0,this.flash-dt*3.4);
      this.boltT=Math.max(0,this.boltT-dt);
      if(this.thunderIn>0){this.thunderIn-=dt;if(this.thunderIn<=0)AU.play('thunder',{i:this.cur==='storm'?1:.7})}
      if(this.cur==='storm'&&state==='play'&&Math.random()<dt*0.11){
        this.flash=opt.flashes?1:.5;this.boltT=.16;this.bolt=makeBolt();
        this.thunderIn=rnd(.5,1.9);
        if(opt.shake)cam.addShake(.25);
      }
    } else this.flash=Math.max(0,this.flash-dt*3.4);
  },
  /* une goutte est-elle en train de tomber ? (intensité visuelle) */
  get stormy(){return this.cur==='storm'}
};
function makeBolt(){
  const x=rnd(W*.15,W*.85),seg=[];let y=-20,xx=x;
  while(y<H*.75){seg.push([xx,y]);y+=rnd(18,52);xx+=rnd(-38,38)}
  return{x,seg,life:.16};
}

/* --------------------------- PLUIE & ÉCLABOUSSURES ----------------------- */
const rain={cv:null,cap:420};
function buildRain(){rain.cv=null}
function updateRain(dt){
  const inten=opt.weather?WX.rain:0,cap=Math.round(rain.cap*opt.particles*clamp(inten*1.2,0,1.3));
  const L=rain.list||(rain.list=[]);
  for(let i=L.length-1;i>=0;i--)if(i>=cap)L.splice(i,1);
  const ang=Math.atan2(WX.windY*1.4+1,WX.windX*1.6);
  while(L.length<cap){
    L.push({x:rnd(-80,W+80),y:rnd(-H,H),sp:rnd(700,1500)*(1+inten*.5),len:rnd(9,26),w:rnd(.7,1.7),a:rnd(.10,.4)*clamp(inten,0,1.2),fg:Math.random()<.25});
  }
  for(let i=L.length-1;i>=0;i--){
    const d=L[i];
    d.y+=Math.cos(ang*.25)*d.sp*dt*1.05;
    d.x+=Math.sin(ang*.25)*d.sp*dt*.55+WX.windX*90*dt;
    if(d.y>H+40){
      if(!d.fg&&Math.random()<.5*inten&&opt.particles>.4){
        /* éclaboussure au sol, dans le monde */
        const wx=cam.x-cam.w/2+rnd(0,cam.w),wy=cam.y-cam.h/2+rnd(cam.h*.15,cam.h);
        FX.add('splash',wx,wy,{vx:rnd(-30,30),vy:-rnd(30,70),l:.3,r:rnd(1.4,3),c:[170,215,255],gl:0,gr:.6});
        if(Math.random()<.25)inWater(wx,wy)&&rippleAt(wx,wy);
      }
      d.x=rnd(-80,W+80);d.y=rnd(-260,-20);d.sp=rnd(700,1500)*(1+inten*.5);
      d.len=rnd(9,26);d.a=rnd(.10,.4)*clamp(inten,0,1.2);
    }
  }
}
function drawRain(fg){
  const L=rain.list||[];if(!L.length)return;
  ctx.lineCap='round';
  for(let i=0;i<L.length;i++){
    const d=L[i];if(!!d.fg!==fg)continue;
    ctx.strokeStyle=`rgba(${fg?'190,215,255':'150,190,235'},${d.a*(fg?.9:.7)})`;
    ctx.lineWidth=d.w*(fg?1.4:1);
    ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-WX.windX*7,d.y+d.len);ctx.stroke();
  }
  ctx.lineCap='butt';
}

/* -------------------------------- CIEL ----------------------------------- */
/* Cycle nocturne : la nuit éternelle vacille entre ténèbres et clair de lune */
const SKY={
  cyc:.28,dur:260,light:1,dawn:0,tint:null,
  stars:[],clouds:[],shoot:[],nextShoot:14,moon:{x:0,y:0,r:0,ph:0},
  PH:[
    {n:'Nuit profonde',c:['#03040e','#0a0f26','#1b1430'],l:.62,dawn:0},
    {n:'Nuit claire',  c:['#061029','#152148','#3a2f55'],l:.86,dawn:0},
    {n:'Lune haute',   c:['#081633','#1b2a56','#4a3a63'],l:1.00,dawn:.05},
    {n:'Avant l’aube', c:['#0d1430','#2b2a52','#5b4258'],l:.92,dawn:.35},
    {n:'Aube voilée',  c:['#1b1a3c','#4a3355','#8a5a5c'],l:.98,dawn:.85}
  ],
  build(){
    this.stars=[];const n=Q.stars;
    for(let i=0;i<n;i++)this.stars.push({x:rnd(0,W),y:rnd(0,H*.8),r:rnd(.4,1.6)*(1+S*.2),p:rnd(0,TAU),s:rnd(.5,2)});
    this.clouds=[];
    for(let i=0;i<10;i++)this.clouds.push({x:rnd(0,W),y:rnd(H*.02,H*.42),w:rnd(120,420)*S,h:rnd(26,80)*S,a:rnd(.05,.16),sp:rnd(3,11)});
    this.shoot=[];
  },
  update(dt){
    this.cyc=(this.cyc+dt/this.dur)%1;
    const f=this.cyc*this.PH.length,i0=Math.floor(f)%this.PH.length,i1=(i0+1)%this.PH.length,k=smooth(f-Math.floor(f));
    const A=this.PH[i0],B=this.PH[i1];
    this.light=lerp(A.l,B.l,k);this.dawn=lerp(A.dawn,B.dawn,k);
    this.tint=[mix(A.c[0],B.c[0],k),mix(A.c[1],B.c[1],k),mix(A.c[2],B.c[2],k)];
    this.phaseName=(k<.5?A:B).n;
    /* lune */
    const mp=this.cyc;
    this.moon.x=W*(.15+mp*.7);this.moon.y=H*(.30-Math.sin(mp*Math.PI)*.22);this.moon.r=Math.min(W,H)*.055;
    /* étoiles filantes */
    this.nextShoot-=dt;
    if(this.nextShoot<=0){this.nextShoot=rnd(18,55);
      this.shoot.push({x:rnd(0,W*.8),y:rnd(0,H*.35),vx:rnd(300,620),vy:rnd(90,190),l:1.1});}
    for(let i=this.shoot.length-1;i>=0;i--){const s=this.shoot[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.l-=dt*.85;if(s.l<=0)this.shoot.splice(i,1)}
    for(const c of this.clouds){c.x+=c.sp*dt*4*(0.4+WX.wind);if(c.x>W+c.w)c.x=-c.w}
    for(const s of this.stars)s.p+=dt*s.s;
  },
  draw(cx,cy){
    const w=worlds[worldId]||worlds[0];
    const base=this.tint||w.sky;
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,css(base[0]));g.addColorStop(.55,css(base[1]));g.addColorStop(1,css(mix(base[2],this.dawn>.4?'#6b4a4a':base[2],this.dawn*.6)));
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    /* étoiles */
    const dark=1-clamp(this.light,0,1.2)*.55;
    for(const s of this.stars){
      const a=(.25+.5*Math.abs(Math.sin(s.p)))*(1-dark*.5);
      ctx.globalAlpha=a;circle(s.x,s.y,s.r,'#fff6d8');
    }
    ctx.globalAlpha=1;
    /* constellations : quelques segments entre étoiles brillantes */
    if(Q.stars>200){
      ctx.strokeStyle='rgba(180,210,255,.07)';ctx.lineWidth=1;
      for(let i=0;i<8;i++){
        const a=this.stars[(i*7)%this.stars.length],b=this.stars[(i*7+5)%this.stars.length];
        if(!a||!b)continue;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
      }
    }
    /* étoiles filantes */
    for(const s of this.shoot){
      ctx.globalAlpha=clamp(s.l,0,1);ctx.strokeStyle='rgba(255,246,210,.75)';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.vx*.09,s.y-s.vy*.09);ctx.stroke();
      glow(s.x,s.y,10*S,'255,246,210',.4);
    }
    ctx.globalAlpha=1;
    /* nuages */
    for(const c of this.clouds){
      ctx.globalAlpha=c.a*(.6+this.light*.4);
      ctx.fillStyle='rgba(120,140,190,1)';
      ctx.beginPath();ctx.ellipse(c.x,c.y,c.w,c.h,0,0,TAU);ctx.fill();
      ctx.beginPath();ctx.ellipse(c.x+c.w*.5,c.y+c.h*.2,c.w*.6,c.h*.8,0,0,TAU);ctx.fill();
    }
    ctx.globalAlpha=1;
    this.drawMoon();
  },
  drawMoon(){
    const m=this.moon;if(m.r<=0)return;
    const px=m.x+ (0),py=m.y;
    glow(px,py,m.r*5.5,'200,225,255',.13*this.light);
    const g=ctx.createRadialGradient(px-m.r*.3,py-m.r*.3,m.r*.1,px,py,m.r);
    g.addColorStop(0,'#fdfbf0');g.addColorStop(.7,'#e8e6d2');g.addColorStop(1,'#b9bcc9');
    ctx.globalAlpha=clamp(.55+this.light*.5,0,1);
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,m.r,0,TAU);ctx.fill();
    ctx.globalAlpha=1;
    /* cratères + halo */
    ctx.fillStyle='rgba(160,160,175,.25)';
    ctx.beginPath();ctx.arc(px-m.r*.28,py-m.r*.15,m.r*.20,0,TAU);ctx.fill();
    ctx.beginPath();ctx.arc(px+m.r*.30,py-m.r*.34,m.r*.13,0,TAU);ctx.fill();
    ctx.beginPath();ctx.arc(px+m.r*.10,py+m.r*.34,m.r*.17,0,TAU);ctx.fill();
  },
  get name(){return this.phaseName||this.PH[0].n}
};


/* ============================ P2b — CAMÉRA & ARÈNE ======================= */
const cam={
  x:0,y:0,w:0,h:0,zoom:1,tz:1,shake:0,shakeX:0,shakeY:0,view:1,
  reset(){this.zoom=this.tz=this.view=1;this.shake=0;this.shakeX=this.shakeY=0;this.resize()},
  resize(){this.w=W/this.zoom;this.h=H/this.zoom},
  addShake(v){if(!opt.shake)return;this.shake=Math.min(1.2,this.shake+v*CFG.shake)},
  snap(x,y){this.x=x-this.w/2;this.y=y-this.h/2;this.clampTo()},
  clampTo(){
    const a=ARENA;
    if(a.w){if(this.w>=a.w)this.x=(a.w-this.w)/2;else this.x=clamp(this.x,0,a.w-this.w);
           if(this.h>=a.h)this.y=(a.h-this.h)/2;else this.y=clamp(this.y,0,a.h-this.h)}
  },
  follow(px,py,vx,vy,dt,zoomTarget){
    this.tz=zoomTarget==null?1:zoomTarget;
    this.zoom=damp(this.zoom,this.tz,2.4,dt);this.w=W/this.zoom;this.h=H/this.zoom;
    const lead=.22;
    const tx=px+vx*lead-this.w/2,ty=py+vy*lead-this.h/2;
    this.x=damp(this.x,tx,4.6,dt);this.y=damp(this.y,ty,4.6,dt);
    this.clampTo();
    this.shake=damp(this.shake,0,5.5,dt);
    const s=this.shake*16*S;
    this.shakeX=rnd(-s,s);this.shakeY=rnd(-s,s);
  },
  apply(){
    const a=ARENA,baseX=-Math.round(this.x),baseY=-Math.round(this.y);
    let sx=this.shakeX,sy=this.shakeY;
    if(a.w){
      const minX=W-a.w*this.zoom,maxX=0,minY=H-a.h*this.zoom,maxY=0;
      if(a.w*this.zoom<=W)sx=0;else sx=clamp(sx,minX-baseX,maxX-baseX);
      if(a.h*this.zoom<=H)sy=0;else sy=clamp(sy,minY-baseY,maxY-baseY);
    }
    ctx.translate(baseX+sx,baseY+sy);
  },
  inView(x,y,pad=60){return x>this.x-pad&&x<this.x+this.w+pad&&y>this.y-pad&&y<this.y+this.h+pad},
  get cx(){return this.x+this.w/2},get cy(){return this.y+this.h/2}
};

/* --------------------------- SPRITES PRÉ-RENDUS -------------------------- */
function mkCv(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c}
const SPR={trees:{},bush:{},grass:{},rock:{},fog:null,ruin:{}};
/* arbre vu de dessus (canopée) — 4 silhouettes par monde */
function treeSprite(wid,v){
  const key=wid+'_'+v;if(SPR.trees[key])return SPR.trees[key];
  const w=worlds[wid]||worlds[0],rng=mulberry32(1000+wid*37+v*91);
  const type=['broad','pine','willow','dead','twist'][wid%5];
  const CW=220,CH=230,c=mkCv(CW,CH),g=c.getContext('2d');
  const cx=CW/2,cy=CH*0.50,R=52+rng()*16;
  const rr=(w.foliage||['#2f6b4a'])[v%3];
  const dark=shade(rr,.30),mid=shade(rr,.62),light=shade(rr,1.20);
  g.lineJoin='round';
  /* ombre portée au sol */
  g.globalAlpha=.34;g.fillStyle='#01040a';
  g.beginPath();g.ellipse(cx,cy+R*.58,R*.92,R*.28,0,0,TAU);g.fill();g.globalAlpha=1;
  /* silhouette dentelée (vue de dessus) */
  const blob=(ox,oy,rad,squash,seed)=>{
    g.beginPath();
    const N=18;let first=true;
    for(let i=0;i<=N;i++){
      const a=i/N*TAU;
      const jit=(hash2(seed*7+i,seed,3)*.30+.84);
      const x=ox+Math.cos(a)*rad*jit, y=oy+Math.sin(a)*rad*jit*squash;
      if(first){g.moveTo(x,y);first=false}else{
        const pa=(i-.5)/N*TAU,pj=(hash2(seed*7+i-1,seed,3)*.3+.84);
        g.quadraticCurveTo(ox+Math.cos(pa)*rad*pj*1.06,oy+Math.sin(pa)*rad*pj*squash*1.06,x,y);}
    }
    g.closePath();
  };
  if(type==='dead'){
    g.strokeStyle=css(dark);g.lineCap='round';
    for(let i=0;i<9;i++){const a=-Math.PI/2+(i-4)*.30;
      g.lineWidth=rng()*3.4+1.6;
      g.beginPath();g.moveTo(cx,cy+R*.35);
      const L=R*(1.1+rng()*.8);
      g.quadraticCurveTo(cx+Math.cos(a)*L*.55,cy+R*.3+Math.sin(a)*L*.55,cx+Math.cos(a+(rng()-.5)*.5)*L,cy+R*.35+Math.sin(a)*L);g.stroke()}
  }else if(type==='pine'){
    for(let k=0;k<3;k++){
      const s=1-k*.26,yy=cy-R*.22+k*R*.30;
      const gr=g.createRadialGradient(cx-R*.2,yy-R*.3,2,cx,yy,R*(1.02-k*.1));
      gr.addColorStop(0,css(light));gr.addColorStop(.5,css(rr));gr.addColorStop(1,css(dark));
      g.fillStyle=gr;blob(cx,yy,R*(1.0-k*.05),.88,v*13+k);g.fill();
      g.strokeStyle=css(shade(rr,.18),.75);g.lineWidth=2.2;g.stroke();
    }
  }else{
    /* tronc visible sous la canopée */
    g.strokeStyle=css(shade(w.trunk||'#101a22',1),1);g.lineWidth=R*.20;g.lineCap='round';
    g.beginPath();g.moveTo(cx,cy+R*.5);g.lineTo(cx+Math.sin(v)*R*.1,cy+R*1.05);g.stroke();
    const gr=g.createRadialGradient(cx-R*.30,cy-R*.34,R*.1,cx,cy,R*1.15);
    gr.addColorStop(0,css(light));gr.addColorStop(.42,css(rr));gr.addColorStop(.82,css(mid));gr.addColorStop(1,css(dark));
    g.fillStyle=gr;blob(cx,cy,R*(type==='twist'?.98:1.03),type==='willow'?.92:.86,v*13);g.fill();
    g.strokeStyle=css(shade(rr,.16),.8);g.lineWidth=2.4;g.stroke();
    /* branches apparentes + trous d'ombre */
    g.save();g.clip();
    g.strokeStyle=css(dark,.55);g.lineWidth=1.6;
    for(let i=0;i<6;i++){const a=i/6*TAU+rng()*.4;
      g.beginPath();g.moveTo(cx+rng(-6,6),cy+rng(-6,6));
      g.quadraticCurveTo(cx+Math.cos(a)*R*.6,cy+Math.sin(a)*R*.45,cx+Math.cos(a+.3)*R*1.1,cy+Math.sin(a+.3)*R*.9);g.stroke()}
    for(let i=0;i<4;i++){
      const a=rng()*TAU,d=R*rng(.2,.7);
      g.fillStyle=css(dark,.30);
      g.beginPath();g.ellipse(cx+Math.cos(a)*d,cy+Math.sin(a)*d*.8,R*.26,R*.18,a,0,TAU);g.fill();
    }
    if(type==='willow'){g.strokeStyle=css(shade(rr,.6),.55);g.lineWidth=2.2;
      for(let i=0;i<12;i++){const a=i/12*TAU,r0=R*1.0;
        const bx=cx+Math.cos(a)*r0,by=cy+Math.sin(a)*r0*.86;
        g.beginPath();g.moveTo(bx,by);g.quadraticCurveTo(bx+7,by+26,bx-5,by+50);g.stroke()}}
    g.restore();
  }
  /* liseré de lune sur le dessus */
  g.globalCompositeOperation='lighter';
  const mg=g.createRadialGradient(cx-R*.34,cy-R*.40,2,cx-R*.34,cy-R*.40,R*1.25);
  mg.addColorStop(0,css(mix(light,'#d7e7ff',.55),.20));mg.addColorStop(.6,css('#9dc0ff',.07));mg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=mg;g.beginPath();g.arc(cx-R*.34,cy-R*.40,R*1.3,0,TAU);g.fill();
  g.globalCompositeOperation='source-over';
  SPR.trees[key]=c;return c;
}

/* ------------------------------- ARÈNE ---------------------------------- */
const ARENA={w:0,h:0,wid:0,nid:0,seed:0,terrain:null,far:null,mid:null,
  trees:[],bushes:[],grass:[],rocks:[],ruins:[],water:[],ripples:[],flies:[],secrets:[],chest:null,altar:null,bossPos:null};
function inWater(x,y){
  const a=ARENA;for(let i=0;i<a.water.length;i++){const p=a.water[i];
    const dx=(x-p.x)/p.rx,dy=(y-p.y)/p.ry;if(dx*dx+dy*dy<1)return p}
  return null;
}
function rippleAt(x,y,r0=6,r1=34,c){ARENA.ripples.push({x,y,r:r0,r1,l:.9,ml:.9,c:c||'190,225,255'});if(ARENA.ripples.length>90)ARENA.ripples.shift()}
function buildArena(wid,nid){
  const w=worlds[wid]||worlds[0],seed=wid*977+nid*131+7,rng=mulberry32(seed);
  const boss=(maps[wid][nid].kind==='boss'||maps[wid][nid].kind==='final');
  const A=ARENA;
  A.wid=wid;A.nid=nid;A.seed=seed;A.trees=[];A.bushes=[];A.grass=[];A.rocks=[];A.ruins=[];
  A.water=[];A.ripples=[];A.flies=[];A.secrets=[];A.chest=null;A.altar=null;
  A.w=Math.round((boss?2100:(2700+wid*420))*S);A.h=Math.round((boss?1450:(1900+wid*260))*S);
  /* --- eau : mares / lac --- */
  const wn=Math.round((w.water||0)*rnd(1.4,3.2));
  for(let i=0;i<wn;i++){
    let px,py,rx,ry,tries=0;
    do{px=rnd(A.w*.18,A.w*.82);py=rnd(A.h*.18,A.h*.82);rx=rnd(90,210);ry=rx*rnd(.5,.8);tries++}
    while(tries<20&&Math.hypot(px-A.w/2,py-A.h/2)<Math.max(rx,ry)+150);
    A.water.push({x:px,y:py,rx,ry,seed:rng()*1000,lv:Math.random()<.4?2:1,ph:rng()*TAU});
  }
  /* --- arbres --- */
  const A2=(A.w*A.h)/1.0e6;              // densité proportionnelle à la surface
  const nTree=Math.round(A2*(boss?8:16)*Q.trees);
  for(let i=0;i<nTree;i++){
    const x=rnd(30,A.w-30),y=rnd(30,A.h-30);
    if(Math.hypot(x-A.w/2,y-A.h/2)<(boss?260:170)*S)continue;
    if(inWater(x,y))continue;
    const v=rndi(0,3),sc=rnd(.75,1.25)*(boss?.9:1);
    A.trees.push({x,y,v,sc,ph:rng()*TAU,sw:rng(.6,1.4),d:rng(.4,1)});
  }
  A.trees.sort((a,b)=>a.y-b.y);
  /* --- buissons / herbe / rochers --- */
  const nB=Math.round(A2*(boss?5:13)*Q.grass);
  for(let i=0;i<nB;i++){const x=rnd(20,A.w-20),y=rnd(20,A.h-20);if(inWater(x,y))continue;
    A.bushes.push({x,y,v:rndi(0,3),sc:rnd(.7,1.3),ph:rng()*TAU})}
  const nG=Math.round(A2*(boss?70:230)*Q.grass);
  for(let i=0;i<nG;i++){const x=rnd(6,A.w-6),y=rnd(6,A.h-6);
    A.grass.push({x,y,v:rndi(0,3),sc:rnd(.6,1.35),ph:rng()*TAU,d:rng(.5,1)})}
  const nR=Math.round(A2*(6*(w.ruins||.2)+4))+(wid===1?8:wid===3?10:0);
  const far2=(x,y,m)=>Math.hypot(x-A.w/2,y-A.h/2)>(m)*S;
  for(let i=0;i<nR;i++){const x=rnd(40,A.w-40),y=rnd(40,A.h-40);if(inWater(x,y)||!far2(x,y,boss?240:150))continue;
    A.rocks.push({x,y,v:rndi(0,3),sc:rnd(.6,1.3),ph:rng()*TAU})}
  /* --- ruines --- */
  const nRu=Math.round((w.ruins||0)*7);
  for(let i=0;i<nRu;i++){const x=rnd(120,A.w-120),y=rnd(120,A.h-120);if(inWater(x,y)||!far2(x,y,boss?260:170))continue;
    A.ruins.push({x,y,v:rndi(0,2),sc:rnd(.9,1.5),ph:rng()*TAU})}
  /* --- secrets : autel de fragments + coffre caché --- */
  const nbSecrets=1+((wid+nid)%2);
  for(let i=0;i<nbSecrets;i++){
    let x,y,ok=false,tries=0;
    do{x=rnd(A.w*.12,A.w*.88);y=rnd(A.h*.12,A.h*.88);ok=!inWater(x,y);tries++}while(!ok&&tries<20);
    A.secrets.push({x,y,found:false,kind:i===0?'frag':'cache',ph:rng()*TAU});
  }
  for(let i=0;i<(wid>0?2:1);i++){let x,y,tries=0;   /* V17 : bosquets de lucioles cachés (le 2e exige Grande lanterne niv.2) */
    do{x=rnd(A.w*.06,A.w*.94);y=rnd(A.h*.06,A.h*.94);tries++}while(tries<20&&(inWater(x,y)||Math.hypot(x-A.w/2,y-A.h/2)<220*S));
    A.secrets.push({x,y,found:false,kind:'grove',need:i===1?2:0,ph:rng()*TAU})}
  A.chest=maps[wid][nid].chest?{x:rnd(A.w*.2,A.w*.8),y:rnd(A.h*.2,A.h*.8),open:false,ph:rng()*TAU}:null;
  /* obstacles solides (rochers et ruines) : l'Esprit, lui, les traverse */
  A.solids=[];
  for(const o of A.rocks)A.solids.push({x:o.x,y:o.y,r:24*S*(o.sc||1)});
  for(const o of A.ruins)A.solids.push({x:o.x,y:o.y,r:30*S*(o.sc||1)});
  A.bossPos={x:A.w/2,y:A.h*.30};
  A.spawn={x:A.w/2,y:A.h*.55};
  buildTerrain(wid,seed);
  A.flies=[];
  for(let i=0;i<Math.round(A2*15*Q.grass)+8;i++)
    A.flies.push({x:rnd(0,A.w),y:rnd(0,A.h),vx:rnd(-14,14),vy:rnd(-10,10),ph:rng()*TAU,sp:rng(.6,1.5),wild:true,d:rng(.4,1)});
  return A;
}
/* sol pré-rendu (moitié de résolution, étiré au dessin) */
function buildTerrain(wid,seed){
  const A=ARENA,w=worlds[wid]||worlds[0],rng=mulberry32(seed+13);
  const cw=Math.round(A.w/2),ch=Math.round(A.h/2);
  const c=mkCv(cw,ch),g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,cw*.4,ch);
  gr.addColorStop(0,w.ground[0]);gr.addColorStop(1,w.ground[1]);
  g.fillStyle=gr;g.fillRect(0,0,cw,ch);
  /* taches d'herbe / terre */
  for(let i=0;i<260;i++){
    const x=rng()*cw,y=rng()*ch,r=6+rng()*46;
    g.globalAlpha=.05+rng()*.11;
    g.fillStyle=rng()<.5?css(shade(w.ground[0],1.25)):css(shade(w.moss,.8));
    g.beginPath();g.ellipse(x,y,r,r*rng(.4,1),rng()*3,0,TAU);g.fill();
  }
  /* sentier sinueux */
  g.globalAlpha=.18;g.strokeStyle=css(shade(w.ground[0],1.5));g.lineWidth=26+rng()*14;g.lineCap='round';
  g.beginPath();g.moveTo(cw*.5,ch*.1);
  g.bezierCurveTo(cw*.3,ch*.35,cw*.75,ch*.6,cw*.45,ch*.92);g.stroke();
  g.globalAlpha=1;
  /* racines / fissures */
  g.strokeStyle=css(shade(w.ground[1],.6),.5);
  for(let i=0;i<70;i++){
    g.lineWidth=1+rng()*2;g.beginPath();
    const x=rng()*cw,y=rng()*ch;g.moveTo(x,y);
    g.quadraticCurveTo(x+rng(-20,20),y+rng(-20,20),x+rng(-40,40),y+rng(-40,40));g.stroke();
  }
  ARENA.terrain=c;
}
/* couches de parallaxe (forêt lointaine + forêt moyenne) */
function buildParallax(wid){

/* compagnes : orbitent autour du joueur, accélèrent quand il court          */
function syncFlies(){
  const want=state==='play'?swarmCount():0;
  while(flies.length<want)flies.push({a:rnd(0,TAU),r:rnd(28,54)*S,ph:rnd(0,TAU),sp:rnd(.7,1.4),x:P.x,y:P.y,excite:0,out:0,d:rnd(.5,1)});
  while(flies.length>want)flies.pop();
}
function updateFlies(dt){
  const spd=Math.hypot(P.vx,P.vy)/(520*S);
  for(const f of flies){
    f.ph+=dt*(1.4+spd*2.2+f.excite*3);
    f.excite=Math.max(0,f.excite-dt*1.4);
    f.a+=dt*(.5+spd*1.1)*(f.sp>.9?1:-1)*f.sp;
    const boost=f.out>0?1+f.out*4:1;
    const tr=f.r*boost*(1+spd*.5+f.excite*.35);
    const tx=P.x+Math.cos(f.a+f.ph*.1)*tr,ty=P.y+Math.sin(f.a*1.3+f.ph*.14)*tr*.72-6*S;
    const l=6+spd*6+f.excite*8;
    f.x=damp(f.x,tx,l,dt);f.y=damp(f.y,ty,l,dt);
    if(f.out>0)f.out=Math.max(0,f.out-dt*1.6);
  }
  /* lucioles sauvages : errent, évitent le joueur, se regroupent */
  const wild=ARENA.flies;
  for(let i=0;i<wild.length;i++){
    const f=wild[i];f.ph+=dt*(1+Math.sin(t*.7+f.ph)*.4);
    const d=dist(f.x,f.y,P.x,P.y);
    if(d<95*S){const a=angTo(P.x,P.y,f.x,f.y);f.vx+=Math.cos(a)*40*dt;f.vy+=Math.sin(a)*40*dt}
    else{f.vx+=Math.cos(f.ph*1.3+t*.2)*10*dt*(1+WX.wind);f.vy+=Math.sin(f.ph*.9+t*.16)*9*dt}
    /* petit regroupement */
    if(i%7===0){const g=wild[(i+3)%wild.length];if(g){const dx=g.x-f.x,dy=g.y-f.y,dd=Math.hypot(dx,dy)||1;
      if(dd<260){f.vx+=dx/dd*6*dt;f.vy+=dy/dd*6*dt}}}
    f.vx*=.985;f.vy*=.985;
    f.vx=clamp(f.vx,-30,30);f.vy=clamp(f.vy,-24,24);
    f.x+=f.vx*dt*10;f.y+=f.vy*dt*10;
    if(f.x<10){f.x=10;f.vx=Math.abs(f.vx)}if(f.x>ARENA.w-10){f.x=ARENA.w-10;f.vx=-Math.abs(f.vx)}
    if(f.y<10){f.y=10;f.vy=Math.abs(f.vy)}if(f.y>ARENA.h-10){f.y=ARENA.h-10;f.vy=-Math.abs(f.vy)}
  }
}

function startNode(w,n){
  if(!maps[w]||!maps[w][n]){console.warn('startNode: niveau introuvable',w,n);return false}
  if(n===0)addUnique(SAVE.unlocked,nodeKey(w,n));
  if(!isPlayable(w,n)){notify('Niveau verrouillé','⚠');return false}
  /* Démarrage direct : on construit d'abord l'arène et l'état de partie,
     puis on passe immédiatement en jeu. Aucune transition ne peut laisser
     la carte affichée avec un niveau déjà sélectionné. */
  try{
    TR.pending=null;TR.dir=0;TR.a=0;
    worldId=w;nodeId=n;mapWorld=w;SAVE.zone=w;writeSave();
    buildArena(w,n);
    resetRun();
    uiNotice='';
    setState('play',true);
    return state==='play';
  }catch(err){
    console.error('Impossible de lancer le niveau',w,n,err);
    uiNotice='Impossible de lancer ce niveau. Réessayez.';
    setState('map',true);
    return false;
  }
}
function completeNode(){
  if(state!=='play'||!node)return;
  if(bonusRun>=0){
    gold+=node.reward;SAVE.frag++;addUnique(SAVE.chests,'bonus-'+bonusRun);writeSave();notify('Niveau bonus terminé ! +'+node.reward+' ✦','◇');bonusRun=-1;setState('nodewin');AU.play('victory');AU.music('victory');return;
  }
  const firstTime=!SAVE.completed.includes(nodeKey(worldId,nodeId));
  addUnique(SAVE.completed,nodeKey(worldId,nodeId));
  if(firstTime){const gain=(node.kind==='boss'||node.kind==='final')?3:1;SAVE.frag+=gain;notify('+'+gain+' ✨ Fragment'+(gain>1?'s':'')+' de lumière','✨')}
  gold+=node.reward;score+=node.reward*5;
  const next=nodeId+1;
  if(next<maps[worldId].length)addUnique(SAVE.unlocked,nodeKey(worldId,next));
  if(nodeId===maps[worldId].length-1&&worldId<6)addUnique(SAVE.unlocked,nodeKey(worldId+1,0));
  if(worldId===4&&nodeId===maps[worldId].length-1){SAVE.final=true;finalUnlocked=true;addUnique(SAVE.unlocked,nodeKey(5,0))}
  if(worldId===5&&nodeId===maps[worldId].length-1)addUnique(SAVE.unlocked,nodeKey(6,0));
  if(worldId===6&&nodeId===maps[worldId].length-1){SAVE.gameComplete=true;SAVE.nightmare=true;finalUnlocked=true}
  if(node.chest&&!SAVE.chests.includes(nodeKey(worldId,nodeId))){addUnique(SAVE.chests,nodeKey(worldId,nodeId));gold+=25;SAVE.stats.chests++}
  if(score>best){best=score;newRec=true}
  if(node.kind==='final'){SAVE.final=true;finalBossDefeated=true;writeSave();showVictory();return}
  writeSave();setState('nodewin');winTimer=0;
  AU.play('victory');AU.music('victory');
  P.anim='win';P.winT=0;
}

function hitEnemy(e,dmg,kx,ky,src,heavy){
  if(!e||e.hp<=0)return;
  const T=ETYPE[e.type]||ETYPE.moth,m=T.mass||1;
  if(e.type==='ombre'&&e.vis<.2){FX.text(e.x,e.y-e.r-6*S,'esquive','#a9a0ff',false);return}
  let blocked=false;if(T.armor&&dmg<1.6){dmg*=.4;blocked=true}
  e.hp-=dmg;e.hitT=blocked?.08:.16;
  const kk=(blocked?.35:1)*m;e.kbx=(e.kbx||0)+kx*kk*.9;e.kby=(e.kby||0)+ky*kk*.9;
  const big=!!heavy||dmg>=2,c=big?'255,214,120':'255,240,200';
  FX.burst(e.x,e.y,c,big?12:7,(big?190:120)*S,{type:'spark',l:.4});
  FX.ring(e.x,e.y,c,4*S,(big?36:22)*S,.22);
  FX.text(e.x+rnd(-8,8),e.y-e.r-6*S,blocked?'bloqué':''+Math.round(dmg*10)/10,blocked?'#c8c0a0':big?'#ffd36a':'#ffe9b0',big&&!blocked);
  AU.play('ehit');run.dmg+=dmg;
  if(big){hitStop=Math.max(hitStop,CFG.hitStop);cam.addShake(.1)}
  if(e.hp<=0)killEnemy(e,src);
}
function killEnemy(e,src){

function damageArea(x,y,r,dir,arc,dmg,knock,heavy){
  dmg*=PW.m.dmg;if(PW.m.crit&&Math.random()<PW.m.crit){dmg*=2;heavy=true;FX.text(P.x,P.y-36*S,'CRITIQUE !','#ffd36a',true)}r*=PW.m.reach*(ENDLESS.active?(ENDLESS.bonus.reach||1):1);arc=Math.min(TAU,arc*PW.m.arc);
  const a0=dir-arc/2,a1=dir+arc/2;
  let touched=0;
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];const d=dist(x,y,e.x,e.y);
    if(d>r+e.r)continue;
    if(arc<TAU){const a=angTo(x,y,e.x,e.y);if(mod(a-a0,TAU)>arc)continue}
    const kx=Math.cos(angTo(x,y,e.x,e.y))*(knock||120)*S,ky=Math.sin(angTo(x,y,e.x,e.y))*(knock||120)*S;
    hitEnemy(e,dmg,kx,ky,'player',heavy);touched++;

    const d=dist(x,y,boss.x,boss.y);

function playerUpdate(dt){
  /* timers */
  P.atkCd=Math.max(0,P.atkCd-dt);P.atkT=Math.max(0,P.atkT-dt);
  P.swarmCd=Math.max(0,P.swarmCd-dt);P.swarmT=Math.max(0,P.swarmT-dt);
  P.hurtT=Math.max(0,P.hurtT-dt);P.castT=Math.max(0,P.castT-dt);
  P.cT=Math.max(0,P.cT-dt);P.aimT=Math.max(0,P.aimT-dt);
  if(P.charging)P.charge=Math.min(CFG.chargeFull*1.25,P.charge+dt);
  if(P.buf>0){P.buf-=dt;if(P.atkCd<=0){P.buf=0;playerAttack()}}
  energy=Math.min(maxEnergy,energy+11*dt);
  if(P.deadT>0){
    P.deadT-=dt;P.vx*=Math.pow(.02,dt);P.vy*=Math.pow(.02,dt);
    if(P.deadT<=0)gameOver();
    return;
  }
  /* direction */
  let dx=(KEYS['arrowright']||KEYS['d']?1:0)-(KEYS['arrowleft']||KEYS['q']||KEYS['a']?1:0);
  let dy=(KEYS['arrowdown']||KEYS['s']?1:0)-(KEYS['arrowup']||KEYS['z']||KEYS['w']?1:0);
  if(JOY.on){dx=JOY.dx;dy=JOY.dy}else if(PAD.on&&(PAD.dx||PAD.dy)){dx=PAD.dx;dy=PAD.dy}
  const water=inWater(P.x,P.y);
  P.water=!!water;
  let spd=worldSpeed()*(water?(worldId===2?(water.lv>1?.5:.66):.72):1)*(powerT>0?1.06:1)*(P.charging?.6:1);
  if(dash>0){
    P.x+=P.vx*dt;P.y+=P.vy*dt;P.vx*=.9;P.vy*=.9;
  }else{
    const len=Math.hypot(dx,dy);
    if(len>.08){
      dx/=len;dy/=len;
      P.lastDir={x:dx,y:dy};
      P.vx+=(dx*spd-P.vx)*Math.min(1,dt*8);
      P.vy+=(dy*spd-P.vy)*Math.min(1,dt*8);
    }else{
      P.vx*=Math.pow(.02,dt);P.vy*=Math.pow(.02,dt);
    }
    /* vent : pousse légèrement */
    P.vx+=WX.windX*26*S*dt;P.vy+=WX.windY*10*S*dt;
    P.x+=P.vx*dt;P.y+=P.vy*dt;
  }
  P.x=clamp(P.x,P.r+4,ARENA.w-P.r-4);P.y=clamp(P.y,P.r+4,ARENA.h-P.r-4);
  /* rochers et ruines : solides */
  if(ARENA.solids)for(let i=0;i<ARENA.solids.length;i++){const s=ARENA.solids[i];
    const dd=dist(P.x,P.y,s.x,s.y),rr=s.r+P.r;
    if(dd<rr&&dd>0.001){const a=angTo(s.x,s.y,P.x,P.y);P.x=s.x+Math.cos(a)*rr;P.y=s.y+Math.sin(a)*rr;}}
  /* animation / pas */
  const sp=Math.hypot(P.vx,P.vy),rel=sp/Math.max(1,worldSpeed());
  P.anim=P.atkT>0?'atk':P.castT>0?'cast':(rel>.72?'run':rel>.12?'walk':'idle');
  P.walk+=dt*(2.4+rel*12);
  P.bob=Math.sin(P.walk)*1.6*S*(0.3+rel);
  if(rel>.12){
    P.stepT-=dt*(1+rel*1.6);
    if(P.stepT<=0){
      P.stepT=.30;
      AU.play(water?'waterstep':'step');
      if(water){FX.burst(P.x,P.y+P.r,water.lv>1?'190,235,255':'150,220,235',7,120*S,{type:'splash',l:.45,gr:.7});
        rippleAt(P.x,P.y,4,26,'200,235,255')}
      else FX.burst(P.x,P.y+P.r*.9,worlds[worldId].moss,3,60*S,{type:'dust',l:.5,r:rnd(1.5,3)*S,gl:0});
    }
  }
  /* traînée de lumière */
  if(P.trail.length<2||dist(P.x,P.y,P.trail[P.trail.length-1].x,P.trail[P.trail.length-1].y)>3*S){
    P.trail.push({x:P.x,y:P.y,l:1});
    if(P.trail.length>16)P.trail.shift();
  }
  for(let i=P.trail.length-1;i>=0;i--){P.trail[i].l-=dt*3.4;if(P.trail[i].l<=0)P.trail.splice(i,1)}
  /* orientation */
  if(Math.abs(P.vx)>12)P.face=P.vx<0?-1:1;
}

const EMAX=()=>Math.round(3+worldId*1.1+nodeId*.5)+(worldId===4?1:0);
function spawnerTick(dt){
  const kind=node.kind;
  if(kind==='endless'){
    if(boss)return;
    spawnT-=dt;
    const interval=Math.max(.34,1.05-ENDLESS.wave*.018),cap=Math.min(34,6+ENDLESS.wave*2);
    if(spawnT<=0){
      spawnT=interval*(.72+Math.random()*.42);
      if(enemies.length<cap){
        const pool=['moth','moth','ombre','parasite'];
        if(ENDLESS.wave>=6)pool.push('corbeau','chauvesouris');
        if(ENDLESS.wave>=11)pool.push('predateur','ronceMobile','spectreBrume');
        if(ENDLESS.wave>=16)pool.push('gardien');
        if(ENDLESS.special==='invasion')pool.push('chauvesouris','chauvesouris','chauvesouris');
        spawnEdge(pick(pool));
      }
    }
    return;
  }
  if(kind==='boss'||kind==='final'){spawnT-=dt;if(spawnT<=0){spawnT=rnd(4,8)/(boss?boss.phase:1);if(enemies.length<4)spawnEdge(boss&&boss.phase>1?'parasite':'moth')}return}
  spawnT-=dt;
  if(spawnT>0)return;
  const base=kind==='survive'?1.05:kind==='kill'?1.55:2.6;
  spawnT=Math.max(.42,base-nodeId*.05)*(0.75+Math.random()*.5);
  if(enemies.length>=EMAX())return;
  const w=worldId,n=nodeId;
  let pool=['moth'];
  if(w>=1||n>=2)pool.push('ombre');
  if(w>=1&&n>=2)pool.push('corbeau');
  if(w>=2||n>=3)pool.push('esprit');
  if(w>=3||n>=4)pool.push('predateur');
  if(w>=5||n>=2)pool.push('chauvesouris');
  if(w>=5||n>=3)pool.push('ronceMobile');
  if(w>=6||n>=3)pool.push('spectreBrume');
  const cnt=k=>{let c=0;for(const q of enemies)if(q.type===k)c++;return c};
  if(n>=1)pool.push('parasite');
  if(w>=1&&n>=1&&cnt('racine')<2)pool.push('racine');
  if((w>=2||n>=3)&&cnt('gardien')<1&&Math.random()<.4)pool.push('gardien','gardien');
  spawnEdge(pick(pool));

function enemyUpdate(dt){

  for(let i=enemies.length-1;i>=0;i--){

          if(dist(e.x,e.y,e.lungeX,e.lungeY)<26*S||e.age%3>2.9){e.st='circle';e.a=angTo(P.x,P.y,e.x,e.y);e.tel=0}
        }

      case 'chauvesouris':{

        const s=e.spd*(d<180*S?1.35:.85);e.x+=Math.cos(e.a)*s*dt*factor;e.y+=Math.sin(e.a)*s*dt*factor;
        if(e.tel>0)e.tel-=dt;if(d<320*S&&e.tel<=0){e.tel=1.8;AU.play('warn');e.lungeX=P.x;e.lungeY=P.y}
        break}
      case 'ronceMobile':{
        e.a+=(toP+Math.sin(e.t*2+e.ph)*.9-e.a)*Math.min(1,dt*1.2);
        e.x+=Math.cos(e.a)*e.spd*dt*factor;e.y+=Math.sin(e.a)*e.spd*dt*factor;
        if(e.tel>0)e.tel-=dt;else if(d<280*S){e.tel=1.3;for(let k=-1;k<=1;k++){const a=toP+k*.22;shots.push({x:e.x,y:e.y,vx:Math.cos(a)*170*S,vy:Math.sin(a)*170*S,r:6*S,l:3.5,g:1})}}
        break}
      case 'spectreBrume':{
        e.vis=d<260*S?.35:1;
        e.a+=(toP+Math.sin(e.t*1.7+e.ph)*.45-e.a)*Math.min(1,dt*1.5);
        e.x+=Math.cos(e.a)*e.spd*dt*factor;e.y+=Math.sin(e.a)*e.spd*dt*factor;
        if(e.t>3.2){e.t=0;const a=rnd(0,TAU),dd=rnd(130,260)*S;e.x=clamp(P.x+Math.cos(a)*dd,30,ARENA.w-30);e.y=clamp(P.y+Math.sin(a)*dd,30,ARENA.h-30);FX.burst(e.x,e.y,'150,220,220',12,150*S,{type:'magic'});AU.play('firefly')}
        break}
      case 'parasite':{
        e.rage=damp(e.rage||0,d<210*S?1:0,5,dt);
        const wob=Math.sin(e.t*(6+8*e.rage)+e.ph)*(.35-.2*e.rage);
        e.a+=(toP+wob-e.a)*Math.min(1,dt*(2.5+3*e.rage));
        const s=e.spd*(1+.75*e.rage);e.x+=Math.cos(e.a)*s*dt*factor;e.y+=Math.sin(e.a)*s*dt*factor;
        break}
      case 'racine':{
        if(d<460*S){e.tel+=dt*factor;
          if(e.tel>1.7){e.tel=0;AU.play('warn');for(let k=-1;k<=1;k++){const a=toP+k*.28;shots.push({x:e.x,y:e.y,vx:Math.cos(a)*135*S,vy:Math.sin(a)*135*S,r:5*S,l:4,g:1})}}}
        else e.tel=Math.max(0,e.tel-dt);
        break}
      case 'gardien':{
        if(e.st==='idle')e.st='walk';
        if(e.st==='walk'){e.a+=(toP-e.a)*Math.min(1,dt*1.2);e.x+=Math.cos(e.a)*e.spd*dt*factor;e.y+=Math.sin(e.a)*e.spd*dt*factor;
          if(d<190*S)e.tel+=dt*factor;if(e.tel>1.4){e.st='wind';e.tel=0;AU.play('warn')}}
        else{e.tel+=dt*factor;if(e.tel>=.6){e.st='walk';e.tel=0;FX.ring(e.x,e.y,'255,220,120',e.r*.6,125*S,.45);cam.addShake(.22);FX.burst(e.x,e.y,'255,210,120',16,220*S);
          if(dist(e.x,e.y,P.x,P.y)<125*S)hit(2,Math.cos(toP)*300*S,Math.sin(toP)*300*S)}}
        break}
    }
    e.x=clamp(e.x,-60,ARENA.w+60);e.y=clamp(e.y,-60,ARENA.h+60);
    /* collision joueur */
    if(d<e.r+P.r+2*S&&invul<=0&&P.deadT<=0){
      hit(e.dmg,Math.cos(toP)*260*S,Math.sin(toP)*260*S);
      if(e.type==='moth'||e.type==='ombre'||e.type==='parasite'){killEnemy(e);continue}
    }
    /* hors champ trop longtemps -> recyclage */
    if(!cam.inView(e.x,e.y,Math.max(cam.w,cam.h))){e.out=(e.out||0)+dt;if(e.out>26){enemies.splice(i,1);continue}}else e.out=0;
  }
}

function bossTick(dt){
  if(((node.kind==='boss'||node.kind==='final')||(ENDLESS.active&&ENDLESS.bossPending))&&!boss&&bossWarn<=0){spawnBoss();return}
  if(!boss)return;
  const b=boss,factor=slowT>0?.55:1;
  b.age+=dt;b.hitT=Math.max(0,b.hitT-dt);b.inv=Math.max(0,b.inv-dt*factor);
  const pct=b.hp/b.max;
  if(b.phase===1&&pct<=.66)bossPhase(2);
  else if(b.phase===2&&pct<=.33)bossPhase(3);
  const speedMul=(1+(b.phase-1)*.35);
  if(b.st==='enter'){
    b.y+=120*S*dt*factor;
    if(b.y>=ARENA.bossPos.y){b.y=ARENA.bossPos.y;b.st='idle'}
    return;
  }
  /* déplacement */
  b.sc+=dt*factor*speedMul;
  const amp=WX.stormy?.34:.3;
  b.x=ARENA.w/2+Math.sin(b.sc*.62)*(ARENA.w*amp-b.r);
  b.y=ARENA.bossPos.y+Math.sin(b.sc*1.1)*40*S;
  if(b.type==='Reine des Mites')b.y+=Math.sin(b.sc*2.2)*24*S;
  if(b.type==='Dragon de Cristal')b.x=ARENA.w/2+Math.sin(b.sc*.42)*(ARENA.w*.36);
  /* attaque programmée */
  b.tel-=dt*factor;
  if(b.tel<=0&&b.inv<=0){
    const roll=Math.random();
    if(b.phase>=2&&roll<.16){b.atk='summon'}
    else if(b.phase>=3&&roll<.30){b.atk='rain'}
    else if(b.phase>=2&&roll<.42){b.atk='spiral'}
    else if(roll<(b.phase>1?.6:.4)){b.atk='radial'}
    else if(b.phase>=2&&roll<.72){b.atk='charge'}
    else mainAtk(b);
    b.atk=b.atk||'volley';
    b.tel=b.atk==='summon'?.9:b.atk==='charge'?.8:b.atk==='spiral'?1.9:b.atk==='rain'?1.2:(b.phase===3?.42:b.phase===2?.55:.72);
    if(b.atk==='rain'||b.atk==='spiral')AU.play('warn');
    if(b.atk==='summon'){AU.play('roar');
      for(let i=0;i<1+b.phase;i++){const a=rnd(0,TAU);spawnEnemy(pick(['ombre','esprit','moth']),b.x+Math.cos(a)*150*S,b.y+Math.sin(a)*150*S)}}
    if(b.atk==='charge'){AU.play('warn');b.tx=P.x;b.ty=P.y}
    if(b.atk==='radial')AU.play('warn');
    if(b.atk==='volley')AU.play('warn');
  }
  /* exécution de l'attaque après le télégraphe */
  const firing=b.tel<.16&&b.inv<=0;
  if(firing&&!b.fired){
    b.fired=true;
    if(b.atk==='volley'){fireVolley(b,2+b.phase)}
    else if(b.atk==='radial'){fireRadial(b,(b.phase===3?14:10))}
    else if(b.atk==='charge'){b.st='charge';b.ct=.5}
    else if(b.atk==='summon'){FX.ring(b.x,b.y,'220,120,255',b.r*.4,b.r*5,.5)}
    else if(b.atk==='spiral'){b.spiral=1.6}
    else if(b.atk==='rain'){for(let i=0;i<5+b.phase;i++){const near=i<2;haz.push({x:near?P.x+rnd(-40,40)*S:rnd(60,ARENA.w-60),y:near?P.y+rnd(-40,40)*S:rnd(60,ARENA.h-60),r:64*S,t:0,ml:1.1+i*.12})}}
  }
  if(b.tel>.2)b.fired=false;
  if(b.spiral>0){b.spiral-=dt;b.sp2=(b.sp2||0)-dt;
    if(b.sp2<=0){b.sp2=.1;b.spA=(b.spA||0)+.55;const sp=150*S*(1+(b.phase-1)*.2);
      for(let k=0;k<2;k++){const a=b.spA+k*Math.PI;shots.push({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:5*S,l:4.5})}}}
  if(b.st==='charge'){
    b.ct-=dt;
    const a=angTo(b.x,b.y,b.tx,b.ty);
    b.x+=Math.cos(a)*760*S*dt*factor;b.y+=Math.sin(a)*760*S*dt*factor;
    if(Math.random()<dt*30)FX.add('spark',b.x,b.y,{vx:rnd(-60,60),vy:rnd(-60,60),l:.3,r:2.4,c:[255,140,160],gl:1});
    if(b.ct<=0)b.st='idle';
  }
  b.x=clamp(b.x,b.r,ARENA.w-b.r);b.y=clamp(b.y,b.r*.6,ARENA.h-b.r);
  /* contact + pouvoir */
  if(dist(b.x,b.y,P.x,P.y)<b.r+P.r){hit(1,Math.cos(angTo(b.x,b.y,P.x,P.y))*300*S,Math.sin(angTo(b.x,b.y,P.x,P.y))*300*S)}
  if(powerT>0&&dist(b.x,b.y,P.x,P.y)<lanternR()*1.25&&b.inv<=0)hitBoss(46*dt);
}

/* ---------------------------- décor trié -------------------------------- */
let decoCache={seed:-1,list:[]};
function decoList(){
  if(decoCache.seed===ARENA.seed)return decoCache.list;
  const l=[];
  for(const o of ARENA.ruins)l.push({k:'ruin',o});
  for(const o of ARENA.rocks)l.push({k:'rock',o});
  for(const o of ARENA.trees)l.push({k:'tree',o});
  for(const o of ARENA.bushes)l.push({k:'bush',o});
  l.sort((a,b)=>a.o.y-b.o.y);
  decoCache={seed:ARENA.seed,list:l};
  return l;
}
/* --------------------------- parallaxe lointaine ------------------------- */
function drawParallax(){
  const F=ARENA.far,M=ARENA.mid;
  if(F){const w=F.width,ox=mod(-cam.x*.10,w);
    ctx.globalAlpha=.9;for(let x=ox-w;x<W+w;x+=w)ctx.drawImage(F,x,H*.04+Math.sin(t*.13)*2);ctx.globalAlpha=1}
  if(M){const w=M.width,ox=mod(-cam.x*.24,w);
    ctx.globalAlpha=.95;for(let x=ox-w;x<W+w;x+=w)ctx.drawImage(M,x,H*.16+Math.sin(t*.11+1)*2.5);ctx.globalAlpha=1}
}
/* ------------------------------- TERRAIN -------------------------------- */
function drawTerrain(){
  const A=ARENA;
  ctx.drawImage(A.terrain,0,0,A.w,A.h);
  /* clair de lune : la lumière vient du ciel, plus claire en haut de l'écran */
  ctx.globalCompositeOperation='lighter';
  const mg=ctx.createLinearGradient(0,cam.y-A.h*.2,0,cam.y+cam.h*1.1);
  mg.addColorStop(0,css('#9dc0ff',.055*SKY.light));mg.addColorStop(.6,css('#9dc0ff',.02*SKY.light));mg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=mg;ctx.fillRect(0,0,A.w,A.h);
  ctx.globalCompositeOperation='source-over';
  /* variations douces de luminosité */
  const g=ctx.createRadialGradient(A.w/2,A.h/2,Math.min(A.w,A.h)*.22,A.w/2,A.h/2,Math.max(A.w,A.h)*.64);
  g.addColorStop(0,'rgba(255,240,210,.045)');g.addColorStop(1,'rgba(0,0,0,.26)');
  ctx.fillStyle=g;ctx.fillRect(0,0,A.w,A.h);
}
/* rais de lune volumétriques (traversent la canopée) */
function drawArenaBorders(){
  if(!ARENA.w||!ARENA.h)return;
  /* Même repère que cam.apply() : aucune multiplication par cam.zoom.
     Tout ce qui est hors du rectangle réel de la map est désormais rempli
     en noir pur, sur les quatre côtés. */
  const L=-Math.round(cam.x)+cam.shakeX,T=-Math.round(cam.y)+cam.shakeY;
  const R=L+ARENA.w,B=T+ARENA.h;
  ctx.save();
  ctx.fillStyle='#000';
  if(L>0)ctx.fillRect(0,0,L,H);
  if(R<W)ctx.fillRect(Math.max(0,R),0,Math.max(0,W-R),H);
  if(T>0)ctx.fillRect(0,0,W,T);
  if(B<H)ctx.fillRect(0,Math.max(0,B),W,Math.max(0,H-B));
  ctx.restore();
}
function drawShafts(){
  if(SKY.light<.35)return;
  ctx.save();ctx.globalCompositeOperation='lighter';
  const inten=(.035+.05*SKY.light)*(WX.fog>.5?.55:1)*(WX.rain>.5?.6:1);
  for(let i=0;i<4;i++){
    const ph=t*.028+i*1.9;
    const x=mod(W*.15+Math.sin(ph)*W*.7,W*1.4)-W*.2;
    const w=150*S+Math.sin(ph*1.6)*46*S;
    const gr=ctx.createLinearGradient(x,0,x+w*.9,H);
    gr.addColorStop(0,css('#d6e6ff',inten));gr.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gr;
    ctx.beginPath();ctx.moveTo(x,-30);ctx.lineTo(x+w,-30);ctx.lineTo(x+w*2.4,H+30);ctx.lineTo(x+w*.7,H+30);ctx.closePath();ctx.fill();
  }
  ctx.restore();
}
/* --------------------------------- EAU ---------------------------------- */
function drawWater(){
  const w=worlds[worldId],A=ARENA;
  for(const p of A.water){
    if(!cam.inView(p.x,p.y,Math.max(p.rx,p.ry)+60))continue;
    ctx.save();
    ctx.beginPath();ctx.ellipse(p.x,p.y,p.rx,p.ry,0,0,TAU);ctx.clip();
    const deep=p.lv>1?'#0d2c3a':'#123842';
    const g=ctx.createLinearGradient(p.x,p.y-p.ry,p.x,p.y+p.ry);
    g.addColorStop(0,css(mix(w.sky[1],'#35708a',.55)));g.addColorStop(.55,css(deep));g.addColorStop(1,'rgba(5,18,26,1)');
    ctx.fillStyle=g;ctx.fillRect(p.x-p.rx,p.y-p.ry,p.rx*2,p.ry*2);
    /* ondulations */
    ctx.lineWidth=1.2;
    for(let i=0;i<9;i++){
      const yy=p.y-p.ry+ (i/9)*p.ry*2;
      const ph=Math.sin(t*.9+i*.7+p.ph);
      ctx.strokeStyle=`rgba(170,220,240,${.05+.05*Math.abs(ph)})`;
      ctx.beginPath();
      for(let x=-p.rx;x<=p.rx;x+=18){
        const y=yy+Math.sin((x*.03)+t*1.4+i)*2.2+ph*1.5;
        x===-p.rx?ctx.moveTo(p.x+x,y):ctx.lineTo(p.x+x,y);
      }
      ctx.stroke();
    }
    /* reflet de lune */
    const refx=clamp(cam.x+SKY.moon.x/cam.zoom,p.x-p.rx*.8,p.x+p.rx*.8);
    const rx2=clamp(refx,p.x-p.rx*.8,p.x+p.rx*.8);
    ctx.globalCompositeOperation='lighter';
    const rg=ctx.createRadialGradient(rx2,p.y-p.ry*.2,2,rx2,p.y-p.ry*.2,p.ry*1.1);
    rg.addColorStop(0,'rgba(210,230,255,.22)');rg.addColorStop(1,'rgba(210,230,255,0)');

const LC={cv:null,c:null,w:0,h:0};

  LC.w=Math.max(2,Math.round(W*.5));LC.h=Math.max(2,Math.round(H*.5));

let LSP=null,LSP2=null;
function buildLightSprites(){ /* sprites d'alpha pré-rendus : évite de créer un dégradé par lumière et par frame */
  const mk=st=>{const c=mkCv(256,256),g=c.getContext('2d'),gr=g.createRadialGradient(128,128,0,128,128,128);
    for(const s of st)gr.addColorStop(s[0],`rgba(0,0,0,${s[1]})`);g.fillStyle=gr;g.fillRect(0,0,256,256);return c};
  LSP=mk([[0,1],[.58,1],[.70,.88],[.82,.58],[.92,.24],[1,0]]);   /* joueur : plateau clair + fondu doux */
  LSP2=mk([[0,1],[.05,1],[.6,.55],[1,0]]);                        /* petites sources de lumière */

  const k=cam.zoom*.5,x=(wx-cam.x+cam.shakeX)*k,y=(wy-cam.y+cam.shakeY)*k,r=wr*k;
  if(x<-r||y<-r||x>LC.w+r||y>LC.h+r)return;

  ctx.beginPath();ctx.arc(lx,ly,1.6*S*lp,0,TAU);ctx.fill();
  /* --- liseré --- */
  ctx.strokeStyle=lit?'rgba(190,245,255,.6)':'rgba(170,205,255,.28)';
  ctx.lineWidth=1.2*S;ctx.lineCap='round';
  ctx.beginPath();ctx.arc(.4*S,-10.2*S,7*S,-1.05,.4);ctx.stroke();
  ctx.beginPath();ctx.moveTo(6.2*S,-3.4*S);ctx.quadraticCurveTo(6.9*S,1.6*S,5.6*S,7.6*S);ctx.stroke();
  /* --- flash de dégâts --- */
  if(hurt>0){
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle=`rgba(255,120,140,${hurt*.5})`;
    ctx.beginPath();ctx.arc(.4*S,-6*S,12*S,0,TAU);ctx.fill();
    ctx.globalCompositeOperation='source-over';
  }
  ctx.restore();
  /* --- effets d'état --- */
  if(dash>0){
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<5;i++){const k=i/5;
      line(P.x-P.lastDir.x*(10+i*14)*S,P.y-P.lastDir.y*(10+i*14)*S,
           P.x-P.lastDir.x*(24+i*16)*S,P.y-P.lastDir.y*(24+i*16)*S,`rgba(200,230,255,${.3-k*.05})`,2.4*S-k*S)}
    ctx.globalCompositeOperation='source-over';
  }
  if(P.swarmT>0){ctx.globalCompositeOperation='lighter';
    glow(P.x,P.y,(210*S)*(1-P.swarmT/.9)+40*S,'180,255,235',.25*P.swarmT/.9);ctx.globalCompositeOperation='source-over'}
  if(shield>0){
    const sr=20*S+Math.sin(t*4)*1.2*S;
    ctx.strokeStyle='rgba(120,226,255,.55)';ctx.lineWidth=1.7*S;
    ctx.beginPath();ctx.arc(x,y,sr,0,TAU);ctx.stroke();
    const a0=Math.sin(t*2)*.9;
    ctx.strokeStyle='rgba(200,246,255,.35)';ctx.lineWidth=1*S;
    ctx.beginPath();ctx.arc(x,y,sr-3.4*S,a0,a0+1.5);ctx.stroke();
  }
  /* barre de vie au-dessus du joueur si blessé */
  if(lives<maxLives&&!dying){
    const bw=26*S,f=lives/maxLives;
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(P.x-bw/2,P.y-28*S,bw,3.4*S);
    ctx.fillStyle='#ff8fa3';ctx.fillRect(P.x-bw/2,P.y-28*S,bw*f,3.4*S);
  }
}
/* --------------------------------- ORBES -------------------------------- */
function drawOrb(o){

    ctx.strokeStyle='rgba(160,235,255,.8)';ctx.lineWidth=1.5*S;ctx.beginPath();ctx.arc(o.x,o.y,o.r+4*S*pulse,0,TAU);ctx.stroke();

/* ------------------------- SECRETS / COFFRE ----------------------------- */
function drawSecrets(){
  for(const s of ARENA.secrets){
    if(s.found||(s.need&&perkLv('lantern')<s.need))continue;
    const near=dist(s.x,s.y,P.x,P.y)<260*S;
    if(!s.revealed&&!near)continue;
    const a=s.revealed?1:clamp(1-(dist(s.x,s.y,P.x,P.y)-120*S)/(140*S),0,1);
    ctx.globalAlpha=a;
    if(s.kind==='frag'){
      const pu=1+.2*Math.sin(t*3+s.ph);
      glow(s.x,s.y,46*S*pu,'255,236,170',.4);
      ctx.save();ctx.translate(s.x,s.y);ctx.rotate(t*.6+s.ph);
      ctx.fillStyle='#fff3c4';
      ctx.beginPath();
      for(let i=0;i<4;i++){const ang=i/4*TAU;ctx.lineTo(Math.cos(ang)*13*S*pu,Math.sin(ang)*13*S*pu);ctx.lineTo(Math.cos(ang+.4)*5*S,Math.sin(ang+.4)*5*S)}
      ctx.closePath();ctx.fill();ctx.restore();
    }else{
      glow(s.x,s.y,34*S,'190,240,210',.3);
      ctx.strokeStyle='rgba(190,240,210,.6)';ctx.lineWidth=2*S;
      ctx.beginPath();ctx.arc(s.x,s.y,12*S,0,TAU);ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  const c=ARENA.chest;
  if(c){
    const open=c.open;
    glow(c.x,c.y,open?26*S:40*S,'255,214,120',open?.14:.3);
    ctx.save();ctx.translate(c.x,c.y);
    ctx.fillStyle=open?'#5a4526':'#7a5c2e';
    ctx.strokeStyle='rgba(6,9,20,.6)';ctx.lineWidth=1.4*S;
    ctx.beginPath();ctx.roundRect(-13*S,-9*S,26*S,18*S,3*S);ctx.fill();ctx.stroke();
    ctx.fillStyle='#e0b45e';
    if(!open)ctx.fillRect(-13*S,-2*S,26*S,3*S);
    else{ctx.save();ctx.rotate(-.9);ctx.fillRect(-13*S,-11*S,26*S,4*S);ctx.restore();
      glow(c.x,c.y-6*S,30*S,'255,230,160',.35)}
    ctx.restore();
  }
}
/* -------------------------------- ENNEMIS ------------------------------- */
function drawEnemy(e){
  const T=ETYPE[e.type],col=T.col;
  const flash=e.hitT>0?e.hitT/.16:0;
  ctx.save();ctx.translate(e.x,e.y);
  switch(e.type){
    case 'moth':{
      const c=e.elite?[255,150,90]:col;
      glow(0,0,e.r*2.4,css(c,.2));
      ctx.rotate(e.a);
      const fl=Math.sin(t*14+e.ph);
      ctx.fillStyle=css(c);
      for(const sg of[-1,1]){ctx.beginPath();ctx.ellipse(-2*S,sg*e.r*.6,e.r*.75,e.r*(.55+.25*fl),sg*.5,0,TAU);ctx.fill()}
      ctx.fillStyle=css(shade(c,.6));ctx.beginPath();ctx.ellipse(0,0,e.r*.7,e.r*.28,0,0,TAU);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(e.r*.55,-e.r*.12,1.6*S,0,TAU);ctx.arc(e.r*.55,e.r*.12,1.6*S,0,TAU);ctx.fill();
      break}
    case 'ombre':{
      const a=e.vis*(.55+.45*Math.sin(t*2+e.ph));
      glow(0,0,e.r*3.4,'70,60,120',.18*a);
      ctx.globalAlpha=a;
      ctx.fillStyle='rgba(24,20,44,.92)';
      ctx.beginPath();ctx.ellipse(0,0,e.r*.95,e.r*1.15,Math.sin(t*.9+e.ph)*.2,0,TAU);ctx.fill();
      ctx.fillStyle='rgba(10,8,20,.85)';
      ctx.beginPath();ctx.ellipse(0,-e.r*.5,e.r*.62,e.r*.6,0,0,TAU);ctx.fill();
      ctx.fillStyle=e.elite?'#ffb45a':'#9a8ce0';
      ctx.beginPath();ctx.arc(-e.r*.22,-e.r*.55,1.5*S,0,TAU);ctx.arc(e.r*.22,-e.r*.55,1.5*S,0,TAU);ctx.fill();
      for(let i=0;i<3;i++){const yy=e.r*(.5+i*.4);ctx.globalAlpha=a*(.4-i*.1);
        ctx.beginPath();ctx.ellipse(Math.sin(t*2+i)*3*S,yy,e.r*(.7-i*.16),e.r*.34,0,0,TAU);ctx.fill()}
      break}
    case 'corbeau':{
      const diving=e.st==='dive';
      if(e.st==='circle'&&e.tel>.9){ /* télégraphe du piqué */
        ctx.globalAlpha=clamp((e.tel-.9)/.7,0,1)*.6;
        ctx.fillStyle='rgba(255,80,90,.5)';
        ctx.beginPath();ctx.ellipse(0,0,e.r*2.6,e.r*1.1,0,0,TAU);ctx.fill();ctx.globalAlpha=1}
      glow(0,0,e.r*2.6,'40,40,60',.3);
      ctx.rotate(e.a+(diving?0:Math.sin(t*2)*.1));
      const fl=Math.sin(t*(diving?26:16)+e.ph);
      ctx.fillStyle=diving?'#15151f':'#1d1d2a';
      for(const sg of[-1,1]){ctx.beginPath();ctx.ellipse(-1*S,sg*e.r*.75,e.r*.9,e.r*(.3+.35*Math.abs(fl)),sg*.35,0,TAU);ctx.fill()}
      ctx.fillStyle='#0e0e16';ctx.beginPath();ctx.ellipse(0,0,e.r*.8,e.r*.45,0,0,TAU);ctx.fill();
      ctx.fillStyle='#ff5f5f';ctx.beginPath();ctx.arc(e.r*.55,-e.r*.16,1.7*S,0,TAU);ctx.arc(e.r*.55,e.r*.16,1.7*S,0,TAU);ctx.fill();
      glow(e.r*.6,0,7*S,'255,70,70',.5);
      break}
    case 'esprit':{
      const a=e.vis;
      glow(0,0,e.r*3.6,'150,220,255',.22*a);
      ctx.globalAlpha=a;
      const gr=ctx.createRadialGradient(0,-e.r*.3,1,0,0,e.r*1.5);
      gr.addColorStop(0,'rgba(230,250,255,.95)');gr.addColorStop(.5,'rgba(140,205,255,.55)');gr.addColorStop(1,'rgba(80,140,220,0)');
      ctx.fillStyle=gr;ctx.beginPath();ctx.arc(0,-e.r*.2,e.r*1.5,0,TAU);ctx.fill();
      ctx.fillStyle='rgba(20,32,60,.5)';
      ctx.beginPath();ctx.ellipse(0,-e.r*.55,e.r*.4,e.r*.5,0,0,TAU);ctx.fill();
      ctx.fillStyle='#dff6ff';ctx.beginPath();ctx.arc(-1.6*S,-e.r*.55,1.4*S,0,TAU);ctx.arc(1.6*S,-e.r*.55,1.4*S,0,TAU);ctx.fill();
      for(let i=0;i<4;i++){ctx.globalAlpha=a*(.3-i*.06);
        ctx.beginPath();ctx.ellipse(Math.sin(t*1.6+i)*4*S,e.r*(.3+i*.5),e.r*(.8-i*.15),e.r*.3,0,0,TAU);ctx.fill()}
      break}
    case 'predateur':{
      const stalk=e.st==='stalk';
      const glowA=stalk?clamp(e.tel/1.5,0,1):1;
      glow(0,0,e.r*3,'255,90,90',.14+.2*glowA);
      ctx.rotate(e.a);
      ctx.fillStyle=e.elite?'#3a1420':'#221018';
      ctx.beginPath();ctx.ellipse(0,0,e.r*1.05,e.r*.72,0,0,TAU);ctx.fill();
      ctx.fillStyle=e.elite?'#4a1a28':'#2c1420';
      ctx.beginPath();ctx.ellipse(e.r*.85,0,e.r*.5,e.r*.42,0,0,TAU);ctx.fill();
      for(const sg of[-1,1]){ctx.beginPath();ctx.ellipse(-e.r*.3,sg*e.r*.55,e.r*.5,e.r*.22,sg*.4,0,TAU);ctx.fill()}
      const ec=stalk?`rgba(255,${120+120*Math.sin(t*10)},90,1)`:'#ff6a6a';
      ctx.fillStyle=ec;ctx.beginPath();ctx.arc(e.r*1.05,-e.r*.2,1.8*S,0,TAU);ctx.arc(e.r*1.05,e.r*.2,1.8*S,0,TAU);ctx.fill();
      glow(e.r*1.05,0,9*S*glowA,'255,110,90',.5*glowA);
      break}
  }
  if(e.type==='racine'){
    const arm=clamp(e.tel/1.7,0,1);
    glow(0,0,e.r*3,'120,200,90',.14+.3*arm);
    ctx.strokeStyle='#2a1c14';ctx.lineWidth=3*S;
    for(let i=0;i<6;i++){const a=i/6*TAU+e.ph,w2=Math.sin(t*1.6+i)*.25;ctx.beginPath();ctx.moveTo(0,e.r*.3);
      ctx.quadraticCurveTo(Math.cos(a+w2)*e.r*1.2,Math.sin(a+w2)*e.r*.9+e.r*.4,Math.cos(a)*e.r*1.7,Math.sin(a)*e.r*1.1+e.r*.5);ctx.stroke()}
    ctx.fillStyle='#3a2a1e';ctx.beginPath();ctx.ellipse(0,0,e.r,e.r*.85,0,0,TAU);ctx.fill();
    ctx.fillStyle=arm>.55?'#ff8a6a':'#a6ff86';ctx.beginPath();ctx.arc(0,-e.r*.1,e.r*(.3+.15*arm),0,TAU);ctx.fill();
  }else if(e.type==='parasite'){
    const rg=e.rage||0;glow(0,0,e.r*2.6,rg>.5?'255,90,110':'230,120,200',.2+.2*rg);
    ctx.rotate(e.a);ctx.strokeStyle='#3a1838';ctx.lineWidth=1.6*S;
    for(let i=0;i<3;i++)for(const sg of[-1,1]){const w2=Math.sin(t*(12+10*rg)+i+sg)*.4;ctx.beginPath();ctx.moveTo(-e.r*.2+i*e.r*.4,0);ctx.lineTo(-e.r*.2+i*e.r*.4+w2*e.r,sg*e.r*1.15);ctx.stroke()}
    ctx.fillStyle=rg>.5?'#e0506e':'#c860b4';ctx.beginPath();ctx.ellipse(0,0,e.r*(1+.12*rg),e.r*.7,0,0,TAU);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(e.r*.6,-e.r*.18,1.7*S,0,TAU);ctx.arc(e.r*.6,e.r*.18,1.7*S,0,TAU);ctx.fill();
  }else if(e.type==='gardien'){
    const w2=e.st==='wind'?clamp(e.tel/.6,0,1):0;
    glow(0,0,e.r*3,'240,200,110',.14+.3*w2);
    ctx.fillStyle='#3b3324';ctx.beginPath();ctx.arc(0,0,e.r*(1+.08*w2),0,TAU);ctx.fill();
    ctx.fillStyle='#5a4c33';ctx.beginPath();ctx.ellipse(0,-e.r*.1,e.r*.8,e.r*.62,0,Math.PI,TAU);ctx.fill();
    ctx.strokeStyle='#e8c46a';ctx.lineWidth=2*S;ctx.beginPath();ctx.arc(0,0,e.r*.92,0,TAU);ctx.stroke();
    ctx.fillStyle='#e8c46a';
    for(const sg of[-1,1]){ctx.beginPath();ctx.moveTo(sg*e.r*.9,-e.r*.3);ctx.lineTo(sg*e.r*1.5,-e.r*.95);ctx.lineTo(sg*e.r*.5,-e.r*.75);ctx.fill()}
    ctx.fillStyle=w2>.4?'#ff9a6a':'#fff3c0';ctx.beginPath();ctx.arc(-e.r*.3,-e.r*.05,2.4*S,0,TAU);ctx.arc(e.r*.3,-e.r*.05,2.4*S,0,TAU);ctx.fill();
  }
  if(flash>0){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=flash*.55;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,e.r*1.5,0,TAU);ctx.fill();ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}
  ctx.restore();
  if(e.maxHp>2&&e.hp<e.maxHp){
    const bw=e.r*2.2,f=e.hp/e.maxHp;
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(e.x-bw/2,e.y-e.r-10*S,bw,3*S);
    ctx.fillStyle=e.elite?'#ffb45a':'#ff7b8f';ctx.fillRect(e.x-bw/2,e.y-e.r-10*S,bw*f,3*S);
  }

/* ---------------------------------- BOSS -------------------------------- */
function drawBoss(){
  if(!boss)return;
  const b=boss,c=b.type;
  const col=c==='Dragon de Cristal'?[180,160,255]:c==='Roi de l’Ombre'?[255,70,170]:c==='Hydre des Brumes'?[110,200,190]:c==='Reine des Mites'?[210,150,255]:[255,190,120];
  const rage=b.phase===3?1:b.phase===2?.55:0;
  const base=mix(col,[255,90,90],rage*.5);
  glow(b.x,b.y,b.r*4.4,css(base,.16+.05*rage));
  /* télégraphe */
  if(b.tel>0&&b.inv<=0){
    const k=1-b.tel/(b.phase===3?.42:b.phase===2?.55:.72);
    ctx.strokeStyle=css(base,.35+.4*Math.abs(Math.sin(t*12)));
    ctx.lineWidth=3*S;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r*1.6+k*40*S,0,TAU);ctx.stroke();
    ctx.strokeStyle=css(base,.2);ctx.lineWidth=2*S;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r*2.6-k*40*S,0,TAU);ctx.stroke();
  }
  ctx.save();ctx.translate(b.x,b.y);
  const sway=Math.sin(b.age*1.4)*.05;
  ctx.rotate(sway);
  const body=ctx.createRadialGradient(-b.r*.3,-b.r*.3,b.r*.1,0,0,b.r*1.2);
  body.addColorStop(0,css(shade(base,1.35)));body.addColorStop(1,css(shade(base,.5)));
  ctx.fillStyle=body;
  if(c==='Reine des Mites'){
    const fl=Math.sin(b.age*6)*.3;
    for(const sg of[-1,1]){ctx.beginPath();ctx.ellipse(-b.r*.1,sg*b.r*.75,b.r*1.15,b.r*(.65+.25*fl),sg*.4,0,TAU);ctx.fill()}
    ctx.beginPath();ctx.ellipse(0,0,b.r*.95,b.r*.6,0,0,TAU);ctx.fill();
  } else if(c==='Dragon de Cristal'){
    ctx.beginPath();
    for(let i=0;i<8;i++){const a=i/8*TAU;const rr=b.r*(i%2?1.25:.85);ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr*.8)}
    ctx.closePath();ctx.fill();
    ctx.fillStyle=css(shade(base,1.5));
    for(let i=0;i<5;i++){const a=-1.2+i*.6;ctx.beginPath();
      ctx.moveTo(Math.cos(a)*b.r*.4,Math.sin(a)*b.r*.3);
      ctx.lineTo(Math.cos(a)*b.r*1.5,Math.sin(a)*b.r*1.1);ctx.lineTo(Math.cos(a+.14)*b.r*.5,Math.sin(a+.14)*b.r*.4);ctx.closePath();ctx.fill()}
  } else if(c==='Roi de l’Ombre'){
    ctx.fillStyle='rgba(10,4,16,.92)';
    ctx.beginPath();ctx.moveTo(-b.r*.9,b.r*.9);ctx.quadraticCurveTo(-b.r*1.1,-b.r*.4,0,-b.r*1.05);
    ctx.quadraticCurveTo(b.r*1.1,-b.r*.4,b.r*.9,b.r*.9);ctx.closePath();ctx.fill();
    ctx.fillStyle=css(base);
    for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*b.r*.34,-b.r*.95);
      ctx.lineTo(i*b.r*.34-b.r*.1,-b.r*1.5-((i%2)?6*S:14*S));ctx.lineTo(i*b.r*.34+b.r*.12,-b.r*.95);ctx.closePath();ctx.fill()}
  } else if(c==='Hydre des Brumes'){
    ctx.beginPath();ctx.ellipse(0,b.r*.42,b.r*1.2,b.r*.62,0,0,TAU);ctx.fill();
    for(let i=-1;i<=1;i++){
      const sw=Math.sin(b.age*1.5+i*1.1)*.35;
      const hx=i*b.r*.72+Math.sin(b.age*1.6+i)*7*S,hy=-b.r*.55+Math.sin(b.age*1.3+i*1.7)*8*S;
      ctx.strokeStyle=css(shade(base,.72));ctx.lineWidth=b.r*.30;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(i*b.r*.35,b.r*.25);
      ctx.quadraticCurveTo(i*b.r*.7-sw*b.r,b.r*.05,hx,hy);ctx.stroke();
      ctx.fillStyle=css(base);
      ctx.beginPath();ctx.ellipse(hx,hy,b.r*.40,b.r*.34,sw*.5,0,TAU);ctx.fill();
      ctx.fillStyle='#08120f';
      ctx.beginPath();ctx.ellipse(hx-b.r*.16,hy-b.r*.06,2.6*S,2*S,0,0,TAU);ctx.ellipse(hx+b.r*.16,hy-b.r*.06,2.6*S,2*S,0,0,TAU);ctx.fill();
      glow(hx,hy,b.r*.5,'150,255,230',.18);
    }
  } else { /* Cerf Astral */
    ctx.beginPath();ctx.ellipse(0,b.r*.1,b.r*.95,b.r*.72,0,0,TAU);ctx.fill();
    ctx.beginPath();ctx.ellipse(b.r*.5,-b.r*.35,b.r*.42,b.r*.5,0,0,TAU);ctx.fill();
    ctx.strokeStyle=css(shade(base,1.3));ctx.lineWidth=3.4*S;ctx.lineCap='round';
    for(const sg of[-1,1])for(let i=0;i<3;i++){
      ctx.beginPath();ctx.moveTo(b.r*.5,(-b.r*.7)-i*2*S);
      ctx.quadraticCurveTo(b.r*(.6+i*.28),-b.r*(1.1+i*.12),b.r*(.5+sg*.3)+i*6*S,-b.r*(1.5+i*.2));ctx.stroke()}
  }
  /* yeux */
  const eg=1+.35*Math.sin(t*6);
  ctx.fillStyle=b.phase===3?'#ffd0d0':'#fff';
  ctx.beginPath();ctx.arc(-b.r*.24,-b.r*.24,3.2*S*eg,0,TAU);ctx.arc(b.r*.24,-b.r*.24,3.2*S*eg,0,TAU);ctx.fill();
  glow(0,-b.r*.24,b.r*.8,'255,120,150',.5);
  if(b.hitT>0){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=b.hitT/.14*.5;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,b.r*1.25,0,TAU);ctx.fill();ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}
  ctx.restore();
}
/* -------------------------- PROJECTILES / ONDES ------------------------- */
function drawShots(){

  for(const h of haz){const k=h.t/h.ml;ctx.fillStyle=`rgba(255,80,120,${.06+.16*k})`;ctx.beginPath();ctx.arc(h.x,h.y,h.r*(.4+.6*k),0,TAU);ctx.fill();
    ctx.strokeStyle=`rgba(255,130,160,${.35+.5*k})`;ctx.lineWidth=2*S;ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,TAU);ctx.stroke()}
}
function drawWaves(){
  for(const w of waves){
    const a=w.l/1.4;
    ctx.globalCompositeOperation='lighter';
    const g=ctx.createRadialGradient(w.x,w.y,w.r*.2,w.x,w.y,w.r*1.7);
    g.addColorStop(0,css([220,250,255],.5*a));g.addColorStop(.6,css([140,220,255],.28*a));g.addColorStop(1,css([120,200,255],0));
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(w.x,w.y,w.r*1.7,0,TAU);ctx.fill();
    ctx.globalCompositeOperation='source-over';
    ctx.strokeStyle=css([220,250,255],.5*a);ctx.lineWidth=3*S;
    ctx.beginPath();ctx.arc(w.x,w.y,w.r,w.a-.9,w.a+.9);ctx.stroke();
  }
}
function drawSlashes(){
  for(const s of slashes){
    const k=1-s.l/s.ml,h=s.w||.85,dr=s.k===1?-1:1;
    const c=s.k===2?'255,225,150':s.k===1?'190,255,235':'225,250,255',c2=s.k===2?'255,170,80':s.k===1?'110,235,205':'150,220,255';
    const head=s.a+dr*h*(k*2-1)*1.1,tail=head-dr*h*.9*(1-k*.4),A=Math.min(head,tail),B=Math.max(head,tail);
    ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
    ctx.strokeStyle=`rgba(${c},${(1-k)*.9})`;ctx.lineWidth=((s.k===2?11:7)-k*5)*S;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r*(.6+k*.45),A,B);ctx.stroke();
    ctx.strokeStyle=`rgba(${c2},${(1-k)*.35})`;ctx.lineWidth=((s.k===2?20:13)-k*10)*S;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r*(.55+k*.5),A,B);ctx.stroke();
    ctx.globalCompositeOperation='source-over';
  }
}
function drawChargeFx(){
  if(!P.charging||P.charge<.1)return;
  const f=clamp(P.charge/CFG.chargeFull,0,1),full=f>=1;
  ctx.globalCompositeOperation='lighter';
  ctx.strokeStyle=full?`rgba(255,225,150,${.7+.3*Math.sin(t*30)})`:`rgba(170,235,255,${.25+.5*f})`;
  ctx.lineWidth=(2+2*f)*S;ctx.beginPath();ctx.arc(P.x,P.y,30*S,-Math.PI/2,-Math.PI/2+TAU*Math.max(.02,f));ctx.stroke();

let regions=[],hov={},mouse={x:-99,y:-99,inside:false,down:false};
function pointerIn(x,y,w,h){return mouse.inside&&inside(x,y,w,h,mouse.x,mouse.y)}
function resetRegions(){regions=[]}
function pickRegion(px,py){for(let i=regions.length-1;i>=0;i--){const r=regions[i];if(inside(r.x,r.y,r.w,r.h,px,py))return r}return null}
function tickHover(dt){
  for(const k in hov)hov[k]=damp(hov[k],0,9,dt);
  if(!mouse.inside)return;
  const r=pickRegion(mouse.x,mouse.y);
  const id=r?r.id:null;
  if(id&&hov[id]===undefined)hov[id]=0;
  if(id){const before=hov[id];hov[id]=damp(hov[id],1,14,dt);if(before<.25&&hov[id]>=.25&&!r.disabled)AU.play('ui')}
}
const hv=e=>hov[e]||0;
function button(x,y,w,h,label,o={}){
  const id=o.id||label,hot=hv(id),on=o.on!==false&&!o.disabled;
  const gl=on?hot:0;
  const cx=x+w/2,cy=y+h/2,sc=1+gl*.03;
  ctx.save();ctx.translate(cx,cy);ctx.scale(sc,sc);ctx.translate(-cx,-cy);
  if(gl>0){ctx.globalCompositeOperation='lighter';glow(cx,cy,w*.6,css(o.col||'255,200,110',.16*gl));ctx.globalCompositeOperation='source-over'}
  rr(x,y,w,h,Math.min(14*S,h*.34),
     o.primary?css(mix('#ffb547','#ffd98a',gl),.16+.10*gl):css('#ffffff',.05+.05*gl),
     o.primary?css(mix('#ffd370','#fff0b0',gl),.5+.35*gl):css('#ffffff',.12+.16*gl),Math.max(1,S));
  if(o.icon)txt(o.icon,x+ (o.iconLeft?18*S:14*S),cy+h*.16,(o.iconSize||15)*S,on?'#ffe082':'rgba(255,244,220,.3)',o.iconLeft?'left':'center');
  txtShadow(label,cx+(o.icon?6*S:0),cy+h*.16,(o.size||13)*S,on?(o.primary?'#ffe9b0':'#fff0c2'):'rgba(255,244,220,.32)','center',o.weight||800);
  if(o.sub)txt(o.sub,cx,cy+h*.16+15*S,9*S,'rgba(255,244,220,.45)','center',600);

}

/* ------------------------------- TRANSITIONS ----------------------------- */
const TR={a:0,dir:0,pending:null,speed:3.4};
function onEnter(s){
  if(s==='menu'){AU.music('menu');worldId=0;node=maps[0][0];if(!ARENA.w)buildArena(0,0)}
  else if(s==='map'){AU.music('explore');if(maps[mapWorld])buildParallax(mapWorld)}
  else if(s==='play'){AU.music((node.kind==='boss'||node.kind==='final')?(worldId===4?'final':worldTrack('boss')):worldTrack('explore'))}
  else if(s==='intro'){INTRO.i=0;INTRO.t=0;AU.music('menu')}
  else if(s==='victory'){AU.music('victory')}
  else if(s==='over'||s==='options'||s==='help'||s==='altar'||s==='shop'||s==='nodewin')AU.music(s==='nodewin'?'victory':'menu');
  resetRegions();
}
function setState(s,instant){
  if(instant||s===state){state=s;TR.a=0;TR.dir=0;TR.pending=null;onEnter(s);return}
  TR.pending=s;TR.dir=1;
}
function transitionTick(dt){
  if(TR.dir>0){TR.a=Math.min(1,TR.a+dt*TR.speed);
    if(TR.a>=1){state=TR.pending;TR.pending=null;TR.dir=-1;TR.a=1;onEnter(state)}}
  else if(TR.dir<0){TR.a=Math.max(0,TR.a-dt*TR.speed);if(TR.a<=0)TR.dir=0}
}
function drawTransition(){
  if(TR.a>0){ctx.fillStyle=`rgba(2,3,10,${TR.a})`;ctx.fillRect(0,0,W,H)}
}

/* guide : lucioles qui montrent la direction de l'objectif */
function drawGuide(){
  if(state!=='play')return;
  const idle=Math.hypot(P.vx,P.vy)<40*S&&t>6;
  if(!idle)return;
  let tx=null,ty=null;
  if(node.kind==='collect'||node.kind==='kill'){
    let bd=1e9;
    for(const o of orbs){const d=dist(P.x,P.y,o.x,o.y);if(d<bd){bd=d;tx=o.x;ty=o.y}}
  }
  if(ARENA.chest&&!ARENA.chest.open){const d=dist(P.x,P.y,ARENA.chest.x,ARENA.chest.y);if(d>300*S){tx=ARENA.chest.x;ty=ARENA.chest.y}}
  if(tx==null)return;
  const a=angTo(P.x,P.y,tx,ty);
  const d=dist(P.x,P.y,tx,ty);
  if(d<180*S)return;
  const px=P.x+(cam.cx-P.x)*.34,py=P.y+(cam.cy-P.y)*.34;
  const gx=P.x+Math.cos(a)*120*S,gy=P.y+Math.sin(a)*120*S;
  for(let i=0;i<3;i++){
    const k=i/3,xx=lerp(P.x,gx,k)+Math.cos(t*2+i)*8*S,yy=lerp(P.y,gy,k)+Math.sin(t*2.4+i)*8*S;
    glow(xx,yy,12*S,'170,255,235',.28*(1-k*.4));
  }
}
